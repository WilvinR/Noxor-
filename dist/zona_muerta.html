<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Zona Muerta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Teko:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --red: #ff3b30;
  --amber: #ffb340;
  --cyan: #6fe3ff;
  --glass: rgba(14, 14, 18, 0.55);
  --line: rgba(255, 255, 255, 0.12);
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: none;
  overscroll-behavior: none;
}
body {
  font-family:
    Rajdhani,
    system-ui,
    -apple-system,
    "Segoe UI",
    Roboto,
    sans-serif;
  color: #eee;
}
canvas#c {
  position: fixed;
  inset: 0;
  display: block;
}
.hidden {
  display: none !important;
}
.disp {
  font-family: Teko, Rajdhani, system-ui, sans-serif;
  letter-spacing: 0.04em;
}

/* HUD */
#hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  padding: max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 10px
    max(14px, env(safe-area-inset-left));
}
.panel {
  background: linear-gradient(180deg, rgba(20, 20, 26, 0.72), rgba(8, 8, 12, 0.55));
  border: 1px solid var(--line);
  border-radius: 12px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
}
#hpBox {
  position: absolute;
  left: max(14px, env(safe-area-inset-left));
  top: max(10px, env(safe-area-inset-top));
  padding: 8px 12px 9px;
  width: min(250px, 34vw);
}
.lbl {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.22em;
  color: #aaa;
  display: flex;
  justify-content: space-between;
}
.lbl b {
  color: #fff;
  font-size: 13px;
  letter-spacing: 0.05em;
}
#hpBar {
  position: relative;
  height: 11px;
  margin-top: 5px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.07);
  overflow: hidden;
}
#hpGhost,
#hpFill {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  border-radius: 3px;
}
#hpGhost {
  background: rgba(255, 220, 200, 0.55);
  transition: width 0.6s ease 0.15s;
}
#hpFill {
  background: linear-gradient(90deg, #b3121b, #ff3b30 70%, #ff7a59);
  box-shadow: 0 0 12px rgba(255, 59, 48, 0.7);
}
#hpBar::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 9.2%, rgba(0, 0, 0, 0.55) 9.2% 10%);
}
#hpBox.low {
  animation: lowhp 0.7s infinite;
}
@keyframes lowhp {
  50% {
    border-color: rgba(255, 59, 48, 0.8);
    box-shadow: 0 0 22px rgba(255, 40, 40, 0.5);
  }
}

#mid {
  position: absolute;
  left: 50%;
  top: max(6px, env(safe-area-inset-top));
  transform: translateX(-50%);
  text-align: center;
}
#dist {
  font-family: Teko, sans-serif;
  font-size: 46px;
  line-height: 0.9;
  font-weight: 500;
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.8);
}
#dist small {
  font-size: 22px;
  color: #bbb;
  margin-left: 2px;
}
#sub {
  font-size: 13px;
  font-weight: 600;
  color: #bdbdbd;
  letter-spacing: 0.08em;
  text-shadow: 0 1px 6px #000;
}
#combo {
  margin-top: 4px;
  font-family: Teko, sans-serif;
  font-size: 24px;
  color: var(--amber);
  text-shadow: 0 0 14px rgba(255, 170, 50, 0.7);
  opacity: 0;
  transition:
    opacity 0.2s,
    transform 0.15s;
}
#combo.on {
  opacity: 1;
}

#wBox {
  position: absolute;
  right: max(14px, env(safe-area-inset-right));
  top: max(10px, env(safe-area-inset-top));
  padding: 7px 12px 9px;
  width: min(230px, 32vw);
  text-align: right;
}
#wTop {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
#wIcon {
  width: 84px;
  height: 28px;
  flex-shrink: 0;
}
#wName {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  line-height: 1.1;
  color: #ccc;
  min-width: 0;
  overflow-wrap: anywhere;
}
#ammo {
  font-family: Teko, sans-serif;
  font-size: 34px;
  line-height: 0.9;
  margin-top: 2px;
}
#ammo span {
  font-size: 20px;
  color: #999;
}
#ammo.empty b {
  color: var(--red);
}
#rlBar {
  height: 3px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 2px;
  margin-top: 4px;
  overflow: hidden;
}
#rlBar i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--amber);
  box-shadow: 0 0 8px var(--amber);
}
#slots {
  display: flex;
  gap: 4px;
  justify-content: flex-end;
  margin-top: 6px;
}
#slots i {
  width: 16px;
  height: 4px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.1);
}
#slots i.own {
  background: rgba(255, 255, 255, 0.45);
}
#slots i.cur {
  background: var(--amber);
  box-shadow: 0 0 6px var(--amber);
}
#fsBtn {
  pointer-events: auto;
  position: absolute;
  right: calc(max(14px, env(safe-area-inset-right)) + 48px);
  top: calc(max(10px, env(safe-area-inset-top)) + 118px);
  width: 40px;
  height: 40px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--glass);
  color: #ddd;
  font-size: 18px;
  backdrop-filter: blur(6px);
}
@media (max-height: 500px) {
  #fsBtn {
    right: calc(max(14px, env(safe-area-inset-right)) + 42px);
  }
}
#pauseBtn {
  pointer-events: auto;
  position: absolute;
  right: max(14px, env(safe-area-inset-right));
  top: calc(max(10px, env(safe-area-inset-top)) + 118px);
  width: 40px;
  height: 40px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--glass);
  color: #ddd;
  font-size: 14px;
  backdrop-filter: blur(6px);
}

#bossBar {
  position: absolute;
  left: 50%;
  top: calc(max(6px, env(safe-area-inset-top)) + 104px);
  transform: translateX(-50%);
  width: min(520px, 52vw);
  text-align: center;
}
#bossName {
  font-family: Teko, sans-serif;
  font-size: 24px;
  letter-spacing: 0.18em;
  color: #ff6b5e;
  text-shadow: 0 0 14px rgba(255, 40, 30, 0.8);
}
.bb {
  height: 12px;
  border-radius: 3px;
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid rgba(255, 80, 60, 0.4);
  overflow: hidden;
  box-shadow: 0 0 18px rgba(255, 30, 20, 0.35);
}
#bossFill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #6d0b0b, #e0261b, #ff6a3d);
  transition: width 0.12s;
}

#banner {
  position: absolute;
  left: 50%;
  top: calc(max(6px, env(safe-area-inset-top)) + 70px);
  transform: translateX(-50%) translateY(-6px);
  padding: 5px 16px 4px;
  border-radius: 10px;
  background: rgba(10, 6, 6, 0.55);
  border: 1px solid rgba(255, 80, 60, 0.35);
  text-align: center;
  font-family: Teko, sans-serif;
  font-size: clamp(20px, 3vw, 30px);
  line-height: 1;
  letter-spacing: 0.12em;
  color: #fff;
  text-shadow: 0 0 14px rgba(255, 40, 30, 0.8);
  white-space: nowrap;
  opacity: 0;
  transition:
    opacity 0.25s,
    transform 0.25s;
}
#banner.on {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
#banner small {
  display: block;
  font-family: Rajdhani, sans-serif;
  font-size: 10px;
  letter-spacing: 0.3em;
  color: #ffb0a8;
  font-weight: 700;
  margin-top: 2px;
}
body.boss #banner {
  top: calc(max(6px, env(safe-area-inset-top)) + 128px);
}
#toast {
  position: absolute;
  left: max(14px, env(safe-area-inset-left));
  top: calc(max(10px, env(safe-area-inset-top)) + 64px);
  padding: 5px 12px;
  border-radius: 999px;
  font-weight: 700;
  letter-spacing: 0.1em;
  font-size: 12px;
  color: #fff;
  background: rgba(10, 10, 14, 0.7);
  border: 1px solid rgba(255, 179, 64, 0.5);
  opacity: 0;
  transition:
    opacity 0.25s,
    transform 0.25s;
  transform: translateY(-6px);
  white-space: nowrap;
}
#toast.on {
  opacity: 1;
  transform: translateY(0);
}
#hint {
  position: absolute;
  left: 50%;
  top: calc(max(6px, env(safe-area-inset-top)) + 70px);
  transform: translateX(-50%);
  padding: 4px 12px;
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.45);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: #ddd;
  text-align: center;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.3s;
}
body.boss #hint {
  top: calc(max(6px, env(safe-area-inset-top)) + 128px);
}
#hint.on {
  opacity: 0.95;
}

@media (max-height: 500px) {
  #hpBox {
    width: min(190px, 28vw);
    padding: 5px 10px 6px;
  }
  #hpBar {
    height: 8px;
    margin-top: 3px;
  }
  #dist {
    font-size: 32px;
  }
  #dist small {
    font-size: 16px;
  }
  #sub {
    font-size: 10px;
  }
  #combo {
    font-size: 18px;
    margin-top: 0;
  }
  #wBox {
    width: min(180px, 26vw);
    padding: 4px 10px 6px;
  }
  #wIcon {
    width: 60px;
    height: 20px;
  }
  #wName {
    font-size: 9px;
  }
  #ammo {
    font-size: 24px;
  }
  #ammo span {
    font-size: 14px;
  }
  #slots {
    margin-top: 3px;
  }
  #slots i {
    width: 11px;
    height: 3px;
  }
  #pauseBtn,
  #fsBtn {
    width: 34px;
    height: 34px;
    top: calc(max(10px, env(safe-area-inset-top)) + 80px);
  }
  #bossBar {
    top: calc(max(6px, env(safe-area-inset-top)) + 58px);
    width: min(400px, 40vw);
  }
  #bossName {
    font-size: 15px;
  }
  .bb {
    height: 8px;
  }
  body.boss #banner,
  body.boss #hint {
    top: calc(max(6px, env(safe-area-inset-top)) + 96px);
  }
  #banner,
  #hint {
    top: calc(max(6px, env(safe-area-inset-top)) + 58px);
  }
  #toast {
    top: calc(max(10px, env(safe-area-inset-top)) + 44px);
    font-size: 10px;
  }
}
/* touch */
#touch {
  position: fixed;
  inset: 0;
  pointer-events: none;
}
.tb {
  position: absolute;
  pointer-events: auto;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: rgba(255, 255, 255, 0.85);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.12em;
  background: radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03));
  border: 1.5px solid rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  touch-action: none;
  transition:
    transform 0.06s,
    background 0.06s;
}
.tb svg {
  width: 42%;
  height: 42%;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.tb.on {
  transform: scale(0.92);
  background: radial-gradient(circle, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.08));
}
#dpad {
  position: absolute;
  left: max(14px, env(safe-area-inset-left));
  bottom: calc(max(10px, env(safe-area-inset-bottom)) + 22px);
  width: 174px;
  height: 174px;
  pointer-events: none;
}
#dpad::before {
  content: "";
  position: absolute;
  left: 58px;
  top: 58px;
  width: 58px;
  height: 58px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid rgba(255, 255, 255, 0.08);
}
#dpad .tb {
  border-radius: 16px;
  width: 58px;
  height: 58px;
}
#dpad .tb svg {
  width: 46%;
  height: 46%;
}
#tU {
  left: 58px;
  top: 0;
  font-size: 8px;
}
#tD {
  left: 58px;
  top: 116px;
  font-size: 8px;
}
#tL {
  left: 0;
  top: 58px;
}
#tR {
  left: 116px;
  top: 58px;
}
#tFire {
  right: max(16px, env(safe-area-inset-right));
  bottom: calc(max(10px, env(safe-area-inset-bottom)) + 22px);
  width: 104px;
  height: 104px;
  border-color: rgba(255, 80, 60, 0.55);
  background: radial-gradient(circle at 50% 35%, rgba(255, 70, 50, 0.3), rgba(120, 10, 10, 0.12));
  color: #fff;
  font-size: 11px;
}
#tFire.on {
  background: radial-gradient(circle, rgba(255, 90, 60, 0.6), rgba(150, 20, 10, 0.3));
}
#tSwap {
  right: calc(max(16px, env(safe-area-inset-right)) + 116px);
  bottom: calc(max(10px, env(safe-area-inset-bottom)) + 30px);
  width: 56px;
  height: 56px;
  font-size: 8px;
}
.tb {
  background: radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.02));
}
/* screens */
.screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.8));
}
.card {
  text-align: center;
  max-width: 620px;
  width: 100%;
}
.title {
  font-family: Teko, sans-serif;
  font-weight: 600;
  font-size: clamp(64px, 13vw, 128px);
  line-height: 0.82;
  letter-spacing: 0.06em;
  color: #f2ede4;
  text-shadow:
    0 0 40px rgba(255, 50, 30, 0.55),
    0 6px 0 #2a0505,
    0 12px 30px #000;
}
.title span {
  color: #ff3b30;
}
.tag {
  margin: 10px 0 22px;
  font-size: clamp(13px, 2.2vw, 17px);
  letter-spacing: 0.42em;
  color: #c9a89f;
  font-weight: 600;
}
.btn {
  pointer-events: auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-width: 210px;
  padding: 13px 26px;
  margin: 6px;
  border-radius: 12px;
  border: 1px solid rgba(255, 90, 70, 0.6);
  background: linear-gradient(180deg, #d8261c, #8c0f0b);
  color: #fff;
  font-family: Teko, sans-serif;
  font-size: 28px;
  letter-spacing: 0.14em;
  cursor: pointer;
  box-shadow:
    0 0 30px rgba(255, 40, 20, 0.35),
    inset 0 1px 0 rgba(255, 255, 255, 0.25);
  transition:
    transform 0.1s,
    filter 0.1s;
}
.btn:hover {
  filter: brightness(1.12);
}
.btn:active {
  transform: scale(0.97);
}
.btn.ghost {
  background: rgba(255, 255, 255, 0.05);
  border-color: var(--line);
  box-shadow: none;
  font-size: 22px;
  min-width: 150px;
}
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin: 18px auto 20px;
  max-width: 560px;
}
.stat {
  padding: 10px 6px;
}
.stat b {
  display: block;
  font-family: Teko, sans-serif;
  font-size: 34px;
  line-height: 1;
  color: #fff;
}
.stat span {
  font-size: 11px;
  letter-spacing: 0.2em;
  color: #999;
  font-weight: 700;
}
.best {
  font-size: 13px;
  letter-spacing: 0.25em;
  color: #ffb340;
  font-weight: 700;
  margin-bottom: 6px;
}
.keys {
  margin-top: 18px;
  font-size: 13px;
  color: #9a9a9a;
  line-height: 1.7;
  letter-spacing: 0.04em;
}
.keys kbd {
  display: inline-block;
  min-width: 22px;
  padding: 0 6px;
  border-radius: 5px;
  border: 1px solid #555;
  background: #1a1a1e;
  color: #ddd;
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
}
#rotate {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: #050506;
  text-align: center;
  padding: 30px;
}
#rotate .ph {
  width: 60px;
  height: 100px;
  border: 3px solid #ddd;
  border-radius: 12px;
  animation: rot 2s infinite ease-in-out;
}
@keyframes rot {
  0%,
  30% {
    transform: rotate(0);
  }
  60%,
  100% {
    transform: rotate(-90deg);
  }
}
#rotate p {
  font-size: 18px;
  letter-spacing: 0.1em;
  font-weight: 600;
}
#rotate small {
  color: #888;
  font-size: 13px;
}
.newrec {
  color: #ffb340;
  font-family: Teko, sans-serif;
  font-size: 26px;
  letter-spacing: 0.2em;
  text-shadow: 0 0 16px rgba(255, 170, 50, 0.6);
}

/* ---- pila central del HUD (antes: posiciones absolutas que se solapaban) ---- */
#stack {
  position: absolute;
  left: 50%;
  top: calc(max(6px, env(safe-area-inset-top)) + 100px);
  transform: translateX(-50%);
  width: min(560px, 60vw);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
#stack #bossBar,
#stack #banner,
#stack #hint {
  position: static;
  left: auto;
  top: auto;
}
#stack #bossBar {
  width: 100%;
  transform: none;
}
#stack #banner {
  transform: translateY(-6px);
}
#stack #banner.on {
  transform: translateY(0);
}
#stack #hint {
  transform: none;
}
@media (max-height: 500px) {
  #stack {
    top: calc(max(6px, env(safe-area-inset-top)) + 64px);
    gap: 5px;
    width: min(420px, 46vw);
  }
}
/* ---- panel de controles ---- */
.keys.panel {
  margin: 20px auto 0;
  max-width: 560px;
  padding: 12px 16px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px 18px;
  text-align: left;
  line-height: 1.35;
  color: #b8b2ac;
  font-size: 13px;
}
.keys.panel .k {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.keys.panel .k > span:first-child {
  flex-shrink: 0;
  min-width: 92px;
  display: flex;
  gap: 3px;
  justify-content: flex-end;
}
@media (max-height: 500px), (max-width: 560px) {
  .keys.panel {
    font-size: 11px;
    margin-top: 10px;
    padding: 8px 12px;
    gap: 3px 12px;
  }
  .keys.panel .k > span:first-child {
    min-width: 74px;
  }
}
.reach {
  font-size: 13px;
  letter-spacing: 0.22em;
  color: #cfc6bd;
  font-weight: 700;
  margin: -6px 0 10px;
}
.btn:focus-visible {
  outline: 2px solid #ffd08a;
  outline-offset: 3px;
}
.btn:disabled {
  filter: grayscale(1) brightness(0.6);
  cursor: default;
}
/* pantallas: entrada suave */
.screen:not(.hidden) .card {
  animation: cardIn 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes cardIn {
  from {
    opacity: 0;
    transform: translateY(14px) scale(0.98);
  }
}
@media (max-height: 500px) {
  .title {
    font-size: clamp(48px, 15vh, 90px);
  }
  .tag {
    margin: 6px 0 10px;
  }
  .btn {
    font-size: 22px;
    padding: 8px 20px;

"use strict";
/* ================== BASE ================== */
const cv = document.getElementById("c");
/** Contexto 2D principal. `ctx` es reasignable: el compositor de personajes (fx.js)

const MAIN = cv.getContext("2d");
let ctx = MAIN;

  GROUND = 452;
let VW = 960,
  SC = 1,
  OX = 0,
  OY = 0,
  DPR = 1,
  RES = 1,
  EXT = 0;

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;

function mulberry(s) {
  return function () {
    s |= 0;
    s = (s + 0x6d2b79f5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

const PMIN0 = 70;

  PSTART = 200;

  (navigator.maxTouchPoints > 0 && !matchMedia("(pointer:fine)").matches);

const CH = 1.14;
let store = {};
try {
  store = JSON.parse(localStorage.getItem("zm_save") || "{}");

<script>
"use strict";
/* ================== FX: sprites cacheados y compositor de personajes ==================
 *
 * 1) Sprites radiales cacheados.
 *    El original creaba un `createRadialGradient` nuevo por cada brillo, luz, partícula de
 *    fuego y llama, en cada fotograma (cientos por frame). Aquí cada degradado se rasteriza
 *    una sola vez en un lienzo de 128 px y luego se dibuja escalado con drawImage.
 *
 * 2) Compositor de actores (jugador, zombis, jefes).
 *    Cada personaje se dibuja en un lienzo auxiliar y se compone con:
 *      - sombreado volumétrico (luz cenital cálida / pies en sombra),
 *      - luz de contorno (rim light) del color de la zona,
 *      - contorno oscuro de silueta para que se lean siempre sobre el fondo,
 *    y después se pega en la escena con su opacidad final (sin artefactos de alfa).
 *    Los brillos (ojos, visor) que se piden durante el dibujo se difieren y se pintan
 *    encima, en coordenadas de mundo, para que no queden contorneados.
 */
const FX = { spr: new Map(), frame: 0, q: 2, qLock: false, acc: 0, n: 0, cool: 3 };
/* Calidad adaptativa de personajes:
 *   2 = contorno + rim light + sombreado   1 = sólo contorno   0 = dibujo directo (como el original)
 * Si el equipo no sostiene ~45 fps se baja un nivel (nunca se sube, para no oscilar).
 * ?q=0|1|2 en la URL fija el nivel manualmente. */
try {
  const qm = /[?&]q=([012])/.exec(location.search);
  if (qm) {
    FX.q = +qm[1];
    FX.qLock = true;
  }
} catch (e) {}
function qualityTick(rawDt) {
  if (FX.qLock || FX.q === 0 || G.state !== "play") return;
  if (FX.cool > 0) {
    FX.cool -= rawDt;
    return;
  }
  FX.acc += rawDt;
  FX.n++;
  if (FX.acc >= 1.5) {
    const avg = FX.acc / FX.n;
    FX.acc = FX.n = 0;
    if (avg > 1 / 45) {
      FX.q--;
      FX.cool = 3;
    }
  }
}

function radialSprite(key, stops) {
  let c = FX.spr.get(key);
  if (c) return c;
  c = document.createElement("canvas");
  c.width = c.height = 128;
  const x = c.getContext("2d");
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  for (const [o, col] of stops) g.addColorStop(o, col);
  x.fillStyle = g;
  x.fillRect(0, 0, 128, 128);
  FX.spr.set(key, c);
  return c;
}
/** Dibuja un sprite radial centrado en (x,y) con radio r y opacidad a. */
function blit(spr, x, y, r, a, additive) {
  const c = ctx,
    ga = c.globalAlpha,
    op = c.globalCompositeOperation;
  c.globalAlpha = ga * a;
  if (additive) c.globalCompositeOperation = "lighter";
  c.drawImage(spr, x - r, y - r, r * 2, r * 2);
  c.globalAlpha = ga;
  c.globalCompositeOperation = op;
}
const glowSpr = (col) =>
  radialSprite("g" + col, [
    [0, `rgba(${col},1)`],
    [1, `rgba(${col},0)`],
  ]);
const lightSpr = (col) =>
  radialSprite("l" + col, [
    [0, `rgba(${col},.55)`],
    [0.4, `rgba(${col},.18)`],
    [1, `rgba(${col},0)`],
  ]);
const fireSpr = (col) =>
  radialSprite("f" + col, [
    [0, col],
    [1, "rgba(255,60,0,0)"],
  ]);
/** Llama del lanzallamas: 8 variantes según su edad (antes: un degradado por partícula). */
function flameSpr(t) {
  const q = Math.min(7, (t * 8) | 0),
    tt = q / 7;
  return radialSprite("fl" + q, [
    [0, `rgba(255,${(220 - tt * 120) | 0},${(140 - tt * 120) | 0},.6)`],
    [0.6, `rgba(255,${(100 - tt * 60) | 0},20,.35)`],
    [1, "rgba(120,20,0,0)"],
  ]);
}

/* ---------------- compositor de actores ---------------- */
const ACT = { on: false, glows: [], bx: 0, by: 0, R: 2 };
const AW = 760,
  AH = 640; // tamaño máximo (unidades virtuales) de la caja de un actor
/** Lienzos auxiliares agrupados por tamaño (múltiplos de 64 px). Usar lienzos pequeños y
 *  ajustados es clave: al reutilizar un lienzo que ya se pintó en la escena, el navegador
 *  copia la superficie completa; con uno grande esa copia costaba más que el propio dibujo. */
const ACT_POOL = new Map();
function actLayers(pw, ph) {
  const R = Math.max(1, Math.min(RES, 2));
  if (ACT.R !== R) {
    ACT_POOL.clear();
    ACT.R = R;
  }
  const w = Math.ceil(pw / 64) * 64,
    h = Math.ceil(ph / 64) * 64,
    key = w * 4096 + h;
  // un juego de lienzos distinto para cada actor del mismo tamaño dentro del fotograma
  let slot = ACT_POOL.get(key);
  if (!slot) ACT_POOL.set(key, (slot = { f: -1, n: 0, sets: [] }));
  if (slot.f !== FX.frame) {
    slot.f = FX.frame;
    slot.n = 0;
  }
  let L = slot.sets[slot.n];
  if (!L) {
    const mk = () => {
      const c = document.createElement("canvas");
      c.width = w;
      c.height = h;
      return { c, x: c.getContext("2d") };
    };
    L = { cv: mk(), ol: mk(), rim: mk(), out: mk() };
    slot.sets.push(L);
  }
  slot.n++;
  ACT.cv = L.cv;
  ACT.ol = L.ol;
  ACT.rim = L.rim;
  ACT.out = L.out;
}
function silhouette(dst, src, pw, ph, col) {
  const x = dst.x;
  x.setTransform(1, 0, 0, 1, 0, 0);
  // "copy" y "source-in" son operaciones globales: sin recorte afectarían a TODO el
  // lienzo auxiliar en cada actor. El clip las limita a la caja del personaje.
  x.save();
  x.beginPath();
  x.rect(0, 0, pw, ph);
  x.clip();
  x.globalCompositeOperation = "copy";
  x.drawImage(src.c, 0, 0, pw, ph, 0, 0, pw, ph);
  x.globalCompositeOperation = "source-in";
  x.fillStyle = col;
  x.fillRect(0, 0, pw, ph);
  x.restore();
}
/**
 * Dibuja un actor con contorno, rim light y sombreado.
 * @param {number} bx,by,bw,bh  caja en coordenadas de mundo que contiene al actor
 * @param {Function} fn         función de dibujo (usa `ctx` y coordenadas de mundo)
 * @param {object} o            {alpha, outline, rim, rimDx, rimDy, shade}
 */
function drawActor(bx, by, bw, bh, fn, o) {
  o = o || {};
  if (FX.q === 0) {
    const ga = ctx.globalAlpha;
    ctx.globalAlpha = ga * (o.alpha == null ? 1 : o.alpha);
    fn();
    ctx.globalAlpha = ga;
    return;
  }
  if (FX.q === 1) o = { ...o, rim: 0, shade: 0 };
  bw = Math.min(bw, AW);
  bh = Math.min(bh, AH);
  const R = Math.max(1, Math.min(RES, 2)),
    pw = Math.ceil(bw * R),
    ph = Math.ceil(bh * R);
  actLayers(pw, ph);
  const A = ACT.cv.x;
  A.setTransform(1, 0, 0, 1, 0, 0);
  A.clearRect(0, 0, pw, ph);
  A.setTransform(R, 0, 0, R, -bx * R, -by * R);
  A.lineCap = "round";
  A.lineJoin = "round";
  A.globalAlpha = 1;
  ACT.on = true;
  ACT.bx = bx;
  ACT.by = by;
  ACT.glows.length = 0;
  const prev = ctx;
  ctx = A;
  try {
    fn();
  } finally {
    ctx = prev;
    ACT.on = false;
  }
  // sombreado volumétrico: luz cálida desde arriba, pies hundidos en sombra
  const sh = o.shade == null ? 1 : o.shade;
  if (sh > 0) {
    A.setTransform(1, 0, 0, 1, 0, 0);
    A.globalAlpha = 1;
    A.globalCompositeOperation = "source-atop";
    const g = A.createLinearGradient(0, 0, 0, ph);
    const z = ZONE;
    g.addColorStop(0, `rgba(${z.key},${0.14 * sh})`);
    g.addColorStop(0.45, "rgba(0,0,0,0)");
    g.addColorStop(1, `rgba(0,0,0,${0.42 * sh})`);
    A.fillStyle = g;
    A.fillRect(0, 0, pw, ph);
    A.globalCompositeOperation = "source-over";
  }
  // Composición. Opaco: directo a la escena (menos pasadas). Semitransparente: primero en
  // un lienzo intermedio para que el contorno no se acumule bajo el cuerpo al desvanecerse.
  const alpha = o.alpha == null ? 1 : o.alpha;
  const viaO = alpha < 0.999;
  const T = viaO ? ACT.out.x : ctx;
  if (viaO) {
    T.setTransform(1, 0, 0, 1, 0, 0);
    T.clearRect(0, 0, pw, ph);
  }
  const put = (src, dx, dy) =>
    viaO
      ? T.drawImage(src, 0, 0, pw, ph, dx * R, dy * R, pw, ph)
      : T.drawImage(src, 0, 0, pw, ph, bx + dx, by + dy, pw / R, ph / R);
  const d = o.outline == null ? 1.7 : o.outline;
  if (d > 0) {
    // contorno con 4 copias diagonales de la silueta (≈ trazo de d px)
    silhouette(ACT.ol, ACT.cv, pw, ph, "rgba(6,4,8,.92)");
    const k = d * 0.92;
    put(ACT.ol.c, -k, -k);
    put(ACT.ol.c, k, -k);
    put(ACT.ol.c, -k, k);
    put(ACT.ol.c, k, k);
  }
  const rim = o.rim == null ? ZONE.rim : o.rim;
  if (rim) {
    silhouette(ACT.rim, ACT.cv, pw, ph, rim);
    put(ACT.rim.c, o.rimDx || 1.3, o.rimDy || -1.4);
  }
  put(ACT.cv.c, 0, 0);
  if (viaO) {
    const ga = ctx.globalAlpha;
    ctx.globalAlpha = ga * alpha;
    ctx.drawImage(ACT.out.c, 0, 0, pw, ph, bx, by, pw / R, ph / R);
    ctx.globalAlpha = ga;
  }
  // brillos diferidos (ojos, visor, núcleo) por encima del contorno
  for (const gl of ACT.glows) glow(gl[0], gl[1], gl[2], gl[3], gl[4] * (o.alpha == null ? 1 : o.alpha));
}

/** Brillo aditivo. Durante el dibujo de un actor se difiere a coordenadas de mundo. */
function glow(x, y, r, col, a) {
  if (ACT.on) {
    const m = ctx.getTransform(),
      R = ACT.R;
    ACT.glows.push([
      (m.a * x + m.c * y + m.e) / R + ACT.bx,
      (m.b * x + m.d * y + m.f) / R + ACT.by,
      (r * Math.hypot(m.a, m.b)) / R,
      col,
      a,
    ]);
    return;
  }
  blit(glowSpr(col), x, y, r, a, true);
}
</script>
<script>
"use strict";
/* ================== AUDIO ================== */
const AU = { c: null, on: store.snd !== false };
function audioInit() {
  if (AU.c) {
    if (AU.c.state === "suspended") AU.c.resume();
    return;
  }
  try {
    const A = window.AudioContext || window.webkitAudioContext;
    const c = new A();
    AU.c = c;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -16;
    comp.knee.value = 12;
    comp.ratio.value = 5;
    comp.attack.value = 0.002;
    comp.release.value = 0.2;
    AU.master = c.createGain();
    AU.master.gain.value = AU.on ? 0.9 : 0;
    AU.master.connect(comp);
    comp.connect(c.destination);
    AU.sfx = c.createGain();
    AU.sfx.gain.value = 1;
    AU.sfx.connect(AU.master);
    AU.mus = c.createGain();
    AU.mus.gain.value = 0.55;
    AU.mus.connect(AU.master);
    const sr = c.sampleRate;
    const mkImp = (sec, dec) => {
      const l = sr * sec,
        b = c.createBuffer(2, l, sr);
      for (let ch = 0; ch < 2; ch++) {
        const d = b.getChannelData(ch);
        for (let i = 0; i < l; i++) {
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / l, dec) * (i < sr * 0.012 ? 0.3 : 1);
        }
      }
      return b;
    };
    AU.rev = c.createConvolver();
    AU.rev.buffer = mkImp(2.6, 3.2);
    const rg = c.createGain();
    rg.gain.value = 0.42;
    AU.rev.connect(rg);
    rg.connect(AU.master);
    const nl = sr * 2;
    AU.noise = c.createBuffer(1, nl, sr);
    let d = AU.noise.getChannelData(0);
    for (let i = 0; i < nl; i++) d[i] = Math.random() * 2 - 1;
    AU.brown = c.createBuffer(1, nl, sr);
    d = AU.brown.getChannelData(0);
    let last = 0;
    for (let i = 0; i < nl; i++) {
      last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
      d[i] = last * 3.5;
    }
    AU.dist = c.createWaveShaper();
    const cu = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) {
      const x = i / 512 - 1;
      cu[i] = Math.tanh(x * 3.2);
    }
    AU.dist.curve = cu;
    AU.dist.connect(AU.sfx);
    AU.dist2 = c.createWaveShaper();
    const cu2 = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) {
      const x = i / 512 - 1;
      cu2[i] = Math.tanh(x * 6);
    }

    const dg = c.createGain();
    dg.gain.value = 0.5;
    AU.dist2.connect(dg);
    dg.connect(AU.sfx);

    const fs = c.createBufferSource();
    fs.buffer = AU.brown;
    fs.loop = true;

    ff.type = "lowpass";
    ff.frequency.value = 900;
    const ff2 = c.createBiquadFilter();
    ff2.type = "peaking";
    ff2.frequency.value = 300;
    ff2.gain.value = 8;
    const fn = c.createBufferSource();
    fn.buffer = AU.noise;
    fn.loop = true;
    const fnf = c.createBiquadFilter();
    fnf.type = "bandpass";
    fnf.frequency.value = 2200;
    fnf.Q.value = 0.8;
    const fng = c.createGain();
    fng.gain.value = 0.18;
    AU.flameG = c.createGain();
    AU.flameG.gain.value = 0;
    fs.connect(ff);
    ff.connect(ff2);
    ff2.connect(AU.flameG);
    fn.connect(fnf);
    fnf.connect(fng);
    fng.connect(AU.flameG);
    AU.flameG.connect(AU.sfx);
    const fr = c.createGain();
    fr.gain.value = 0.3;
    AU.flameG.connect(fr);
    fr.connect(AU.rev);

    let v = 0;
    for (let k = 0; k < 4; k++) v += Math.sin(TAU * fs[k] * t + k) * Math.exp(-t / (0.007 / (k + 1)));

        if (b === 12 && Math.random() < 0.5) tn({ f: 80, f2: 36, fd: 0.15, dur: 0.4, g: 0.25, d: t });
        if (b % 4 === 2) nz({ type: "highpass", f: 7000, g: 0.025, dur: 0.05, d: t });
        if (b % 4 === 0 && Math.random() < 0.45) {

      const f = pick(SCALE);

    MUS.beat++;
    MUS.next += step;
  }

<script>
"use strict";
/* ================== INPUT ================== */
const K = { left: 0, right: 0, jump: 0, slide: 0, fire: 0, swap: 0, jp: 0, sp: 0, wp: 0, rp: 0 };
const KEYMAP = {
  ArrowLeft: "left",
  KeyA: "left",
  ArrowRight: "right",
  KeyD: "right",
  ArrowUp: "jump",
  KeyW: "jump",
  Space: "jump",
  ArrowDown: "slide",
  KeyS: "slide",
  KeyJ: "fire",
  KeyK: "fire",
  KeyF: "fire",
  ControlLeft: "fire",
  KeyQ: "swap",
  KeyE: "swap",
  KeyR: "reload",
};
/** Teclas físicas pulsadas. Una acción sigue activa mientras quede alguna de sus teclas
 *  (antes, soltar A con ← aún pulsada detenía el movimiento). */
const HELD = new Set();
function press(k, v) {
  if (k === "jump" && v && !K.jump) K.jp = 1;
  if (k === "slide" && v && !K.slide) K.sp = 1;
  if (k === "swap" && v && !K.swap) K.wp = 1;
  if (k === "reload") {
    if (v) K.rp = 1;
    return;
  }
  K[k] = v ? 1 : 0;
}
function keyHeld(k) {
  for (const c of HELD) if (KEYMAP[c] === k) return true;
  return false;
}
function releaseAll() {
  HELD.clear();
  for (const k in K) K[k] = 0;
}
addEventListener("keydown", (e) => {
  if (e.code === "KeyP" || e.code === "Escape") {
    togglePause();
    return;
  }
  // Enter: jugar / reintentar / continuar sin ratón
  if (e.code === "Enter" && !e.repeat && document.activeElement?.tagName !== "BUTTON") {
    if (G.state === "menu" || (G.state === "dead" && !$("over").classList.contains("hidden"))) startGame();
    else if (G.state === "paused") togglePause();
    return;
  }
  // 1-7: selección directa de arma
  const dg = /^Digit([1-7])$/.exec(e.code);
  if (dg && G.state === "play") {
    selectW(WORDER[+dg[1] - 1]);
    return;
  }
  const k = KEYMAP[e.code];
  if (k) {
    e.preventDefault();
    if (!e.repeat) {
      HELD.add(e.code);
      press(k, 1);
    }
  }
});
addEventListener("keyup", (e) => {
  const k = KEYMAP[e.code];
  if (!k) return;
  HELD.delete(e.code);
  if (!keyHeld(k)) press(k, 0);
});
// al perder el foco no deben quedar teclas "pegadas"
addEventListener("blur", releaseAll);
// Ratón: sólo el puntero de tipo ratón dispara/para (el original dejaba el disparo
// bloqueado en portátiles con pantalla táctil porque ignoraba el mouseup).
cv.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "mouse" && e.button === 0) K.fire = 1;
});
addEventListener("pointerup", (e) => {
  if (e.pointerType === "mouse" && e.button === 0) K.fire = 0;
});
// Primer toque en un equipo detectado como no táctil: activa los controles táctiles.
addEventListener(
  "touchstart",
  () => {
    if (isTouch) return;
    isTouch = true;
    if (G.state === "play" || G.state === "paused") $("touch").classList.remove("hidden");
    setKeysInfo();
    resize();
  },
  { passive: true },
);
cv.addEventListener("contextmenu", (e) => e.preventDefault());
document.querySelectorAll(".tb").forEach((b) => {
  const k = b.dataset.k;
  const on = (e) => {
    e.preventDefault();
    audioInit();
    try {
      b.setPointerCapture(e.pointerId);
    } catch (_) {}
    b.classList.add("on");
    press(k, 1);
  };
  const off = (e) => {
    b.classList.remove("on");
    press(k, 0);
  };
  b.addEventListener("pointerdown", on);
  b.addEventListener("pointerup", off);
  b.addEventListener("pointercancel", off);
  b.addEventListener("lostpointercapture", off);
});

"use strict";

const LY = {};

    ["cl2", 27, 0.45, 210],
  ]) {

        g.addColorStop(0.4, "rgba(200,60,20,.2)");

}

function fgLayer(lw, r) {

    L = mkLayer(lw, H),
    x = L.x;
  x.fillStyle = "#040304";
  let px = 0;
  while (px < lw) {
    const gap = 140 + r() * 260;
    px += gap;
    if (px > lw - 120) break;
    const w = 60 + r() * 120,
      h = 18 + r() * 26;
    // montículo de escombros
    x.beginPath();
    x.moveTo(px, H);
    for (let k = 0; k <= 6; k++) x.lineTo(px + (w * k) / 6, H - h * (0.4 + r() * 0.6) * Math.sin((k / 6) * PI));

    x.closePath();
    x.fill();
    // varillas de acero retorcidas
    x.strokeStyle = "#040304";
    x.lineWidth = 2.2;
    for (let k = 0; k < 2 + r() * 3; k++) {
      const bx = px + w * (0.2 + r() * 0.6);

      x.moveTo(bx, H - h * 0.5);
      x.quadraticCurveTo(bx + (r() - 0.5) * 30, H - h - 10 - r() * 10, bx + (r() - 0.5) * 40, H - h - 18 - r() * 16);
      x.stroke();
    }
    px += w;
  }
  return L;
}

function shoot() {
  const w = curW(),
    a = curA();

      switchW(1);

        s2: 30,

  } else if (w.rocket) {
    bul.push({
      x: mx,
      y: my,
      vx: F * Math.cos(ang) * w.vel,
      vy: Math.sin(ang) * w.vel,
      dmg: w.dmg,

      t: "rocket",
      pierce: 0,

    for (let i = 0; i < 14; i++)
      part({
        x: gp.x - F * 16,
        y: gp.y,
        vx: -F * rnd(120, 380),
        vy: rnd(-80, 80),
        dr: 3,
        life: rnd(0.5, 1),
        s: rnd(6, 10),
        s2: rnd(24, 40),
        col: "rgba(60,55,55,.55)",
        t: "smoke",
      });
    light(gp.x - F * 20, gp.y, 200, "255,170,90", 0.7);
  } else {
    for (let i = 0; i < w.pel; i++) {
      const an = ang + rnd(-w.sp, w.sp) * (w.pel > 1 ? 1 : 1);
      const v = w.vel * rnd(0.92, 1.05);
      bul.push({
        x: mx,
        y: my,
        vx: F * Math.cos(an) * v,
        vy: Math.sin(an) * v,
        dmg: w.dmg,
        life: 0.7,
        t: P.cur === "sniper" ? "sniper" : "b",
        pierce: w.pierce || 0,
        hit: null,
      });

    sfxShot(P.cur, panOf(mx));
    // muzzle

      x: mx + F * 6,
      y: my,
      life: 0.05,
      s: big ? 20 : 13,
      col: "#fff3c0",

      add: 1,
      rot: F > 0 ? ang : PI - ang,
    });

      part({

        y: my,

      });
    for (let i = 0; i < (big ? 5 : 2); i++)
      part({
        x: mx + F * 4,
        y: my,

        s2: rnd(12, 22),

function updatePlayer(dt) {
  const p = P;
  if (G.state === "dead") {
    p.dead += dt;
    p.vy += 2200 * dt;
    p.y = Math.min(GROUND, p.y + p.vy * dt);

  }
  const mv = K.right - K.left;
  const ar = G.arena;
  const maxX = ar ? VW - 70 : VW * 0.6,
    minX = ar ? (isTouch ? PMIN : 60) : PMIN;

  if (p.x > maxX) p.x = lerp(p.x, maxX, dt * 2);
  p.face = ar && G.boss && !G.boss.dying ? (G.boss.x >= p.x ? 1 : -1) : 1;
  p.idle = ar && mv === 0;
  p.coy -= dt;
  if (p.ground) p.coy = 0.09;
  // búfer de salto: una pulsación justo antes de aterrizar no se pierde (130 ms)
  if (K.jp) p.jb = 0.13;
  else p.jb = (p.jb || 0) - dt;
  if (p.jb > 0 && !(p.ground || p.coy > 0) && p.jumps < 2) {
    p.jb = 0;
    p.vy = -700;
    p.jumps = 2;
    p.flip = 0;
    sfxJump();
    for (let i = 0; i < 5; i++)
      part({
        x: p.x,
        y: p.y,
        vx: rnd(-80, 80),
        vy: rnd(40, 120),
        life: 0.35,
        s: 3,
        s2: 9,
        col: "rgba(160,150,140,.3)",
        t: "smoke",
      });
  }
  if (p.jb > 0 && (p.ground || p.coy > 0)) {
    p.jb = 0;
    p.vy = -880;
    p.jumps = 1;
    p.ground = false;
    p.coy = 0;
    p.slide = 0;
    sfxJump();
    for (let i = 0; i < 6; i++)
      part({
        x: p.x,
        y: GROUND,
        vx: rnd(-120, 40),
        vy: rnd(-60, -10),
        life: 0.5,
        s: 3,
        s2: 10,
        col: "rgba(90,80,75,.3)",
        t: "smoke",
      });
  }
  if (K.sp) {
    if (p.ground) {
      if (p.slide <= 0) sfxSlide();
      p.slide = 0.82;
    } else {
      p.vy = Math.max(p.vy, 950);
      p.sq = true;
    }
  }
  if (p.slide > 0) {
    p.slide -= dt;
    if (K.slide && p.slide < 0.1 && (p.slideHold || 0) < 0.6) {
      p.slide = 0.1;
      p.slideHold = (p.slideHold || 0) + dt;
    }
    if (Math.random() < 0.5)
      part({
        x: p.x + rnd(-10, 10),
        y: GROUND - 2,
        vx: rnd(-220, -80),
        vy: rnd(-60, -10),
        life: 0.4,
        s: 2,
        s2: 8,
        col: "rgba(100,90,85,.3)",
        t: "smoke",
      });
  } else p.slideHold = 0;
  const g = 2100;
  p.vy += g * dt;
  p.y += p.vy * dt;
  if (p.y >= GROUND) {
    if (!p.ground) {
      sfxLand();
      p.land = 0.14;
      for (let i = 0; i < 5; i++)
        part({
          x: p.x,
          y: GROUND,
          vx: rnd(-90, 90),
          vy: rnd(-40, -5),
          life: 0.4,
          s: 3,
          s2: 9,
          col: "rgba(90,80,75,.3)",
          t: "smoke",
        });
      if (p.sq) {
        p.slide = 0.75;
        p.sq = false;
        sfxSlide();
      }
    }
    p.y = GROUND;
    p.vy = 0;
    p.ground = true;
    p.jumps = 0;
  } else p.ground = false;
  const sp = G.arena ? mv * (p.face || 1) * 0.9 : G.speed / 330;
  if (p.ground && p.slide <= 0) {
    const prev = p.phase;
    p.phase += dt * 11.5 * sp;
    if (Math.floor(prev / PI) !== Math.floor(p.phase / PI)) sfxStep();
  }
  p.inv -= dt;
  if (p.land > 0) p.land -= dt;
  p.recoil = Math.max(0, p.recoil - dt * 9);
  // aim
  const gp = gunPos();
  const ta = aimTarget(gp.x, gp.y);
  p.aim = lerp(p.aim, ta, Math.min(1, dt * 14));
  // weapons
  p.cd -= dt;
  if (p.rl > 0) {
    p.rl -= dt;
    if (p.rl <= 0) finishReload();
  }
  if (K.wp) switchW(1);
  if (K.rp) startReload();
  if (K.fire && p.cd <= 0 && p.rl <= 0) shoot();
  if (G.flameOn > 0) {
    G.flameOn -= dt;
    if (G.flameOn <= 0 && AU.flameG) AU.flameG.gain.setTargetAtTime(0, AU.c.currentTime, 0.06);
  }
  K.jp = K.sp = K.wp = K.rp = 0;
}

    eyeCol: d[5] || (body === "mother" ? "200,255,70" : "255,50,30"),
    bw: B.w,
    bh: B.h,
    w: B.w * sc,
    h: B.h * sc,

    num: (idx % 25) + 1,
    x: VW + B.w * sc,
    y: GROUND,

    max: hp,
    st: "enter",
    stT: 0,
    t: 0,
    ph: 0,
    flash: 0,
    arm: 0,
    warn: null,
    cnt: 0,
    vy: 0,
    air: false,
    mouth: 0,
    crouch: 0,
    hitcd: 0,

  $("bossBar").classList.remove("hidden");

function lob(x, y, tx, T, type, dmg) {

<script>

/* ================== UPDATE ================== */
function update(dt) {

  if (G.state === "menu") {

      G.stun -= dt;
      tgt *= 0.55;
    }
    G.speed = lerp(G.speed, tgt, dt * (G.arena ? 3 : 2));
  }
  if (G.state === "dead") G.speed = lerp(G.speed, 0, dt * 2);

    if (L > G.lvl) {
      G.lvl = L;

    G.comboT -= dt;
    if (G.comboT <= 0) G.combo = 0;
  }
  if (G.hintT > 0) {
    G.hintT -= dt;
    if (G.hintT <= 0) $("hint").classList.remove("on");
  }
  if (toastT > 0) {

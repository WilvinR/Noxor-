        } else {
          if (G.dist > 600 && Math.random() < Math.min(0.16, 0.05 + G.dist / 20000)) {
            const n = rint(3, Math.min(6, 3 + Math.floor(G.dist / 1500)));
            for (let i = 0; i < n; i++)
              spawnZombie(Math.random() < 0.7 ? "walker" : "runner", VW + 60 + i * rnd(50, 80));
            G.zt = rnd(2, 3);
          } else {
            spawnZombie(zTypeByDist());
            G.zt = Math.max(0.45, 2.6 - G.dist / 900) * rnd(0.7, 1.3);
          }
        }
      }
      if (!G.boss) {
        G.ot -= dt;
        if (G.ot <= 0) {
          spawnObstacle();
          G.ot = Math.max(1.7, 3.6 - G.dist / 1500) * rnd(0.8, 1.25);
        }
      }
      G.pt -= dt;
      if (G.pt <= 0) {
        spawnPickup();
        if (G.arena) {
          const p = pick_[pick_.length - 1];
          if (p) {
            p.x = rnd((isTouch ? PMIN : 80) + 40, VW * 0.6);
            p.y = GROUND - 48;
          }
        }
        G.pt = rnd(5.5, 9.5) * (G.arena ? 1.3 : 1);
      }
    }
  }
  G.dt -= dt;
  if (G.dt <= 0 && !G.arena) {
    spawnDecor();
    G.dt = rnd(1.2, 3.4);
  }
  const sp = G.speed * dt;
  // decor
  for (const d of decor) {
    d.x -= sp * 0.78;
    if (d.t === "fire" || (d.t === "car" && d.seed % 3 === 0)) {
      if (Math.random() < 0.5)
        part({
          x: d.x + rnd(-18, 18),
          y: GROUND - 16 - (d.t === "car" ? 30 : 8),
          vx: rnd(-20, 20),
          vy: rnd(-140, -60),
          dr: 1,
          life: rnd(0.4, 0.8),
          s: rnd(6, 12),
          s2: 2,
          col: pick(["#ff9a3c", "#ffcc66", "#ff6a1a"]),
          t: "fire",
          add: 1,
          sf: 0.78,
        });
      if (Math.random() < 0.15)
        part({
          x: d.x,
          y: GROUND - 50,
          vx: rnd(-10, 20),
          vy: rnd(-60, -30),
          life: 2.5,
          s: 10,
          s2: 40,
          col: "rgba(20,18,18,.4)",
          t: "smoke",
          sf: 0.78,
        });
    }
    if (d.t === "lamp") {
      d.fl -= dt;
      if (d.fl <= 0) {
        d.on = Math.random() < 0.85;
        d.fl = d.on ? rnd(0.3, 2.5) : rnd(0.03, 0.2);
      }
    }
  }
  decor = decor.filter((d) => d.x > -300);
  // obstacles
  const pb = pbox();
  for (const o of obs) {
    o.x -= sp;
    if (o.boomT > 0) {
      o.boomT -= dt;
      if (o.boomT <= 0) {
        o.dead = 1;
        explode(o.x, GROUND - 25, 150, 180, "barrel");
      }
    }
    if (o.fire && Math.random() < 0.5)
      part({
        x: o.x + rnd(-40, 50),
        y: GROUND - o.h + rnd(0, 15),
        vx: rnd(-30, 30),
        vy: rnd(-160, -70),
        dr: 1,
        life: rnd(0.4, 0.8),
        s: rnd(7, 13),
        s2: 2,
        col: pick(["#ff9a3c", "#ffcc66", "#ff6a1a"]),
        t: "fire",
        add: 1,
      });
    if (G.state === "play" && !o.hit) {
      let box;
      if (o.t === "beam") box = { x: o.x - o.w / 2, y: o.top, w: o.w, h: o.bot - o.top };
      else {
        const ix = o.t === "car" ? 24 : o.t === "barrel" ? 6 : 16;
        box = {
          x: o.x - o.w / 2 + ix,
          y: GROUND - o.h + (o.t === "car" ? 14 : 9),
          w: o.w - ix * 2,
          h: o.h - (o.t === "car" ? 14 : 9),
        };
      }
      if (ov(pb, box)) {
        if (o.t === "barrel") {
          o.hit = 1;
          o.boomT = 0.01;
        } else {
          o.hit = 1;
          hurtPlayer(o.dmg);
          if (o.t !== "wire") G.stun = 0.4;
          for (let i = 0; i < 12; i++)
            part({
              x: P.x + 14,
              y: P.y - 40,
              vx: rnd(-200, 200),
              vy: rnd(-300, -50),
              g: 1100,
              life: rnd(0.4, 0.9),
              s: rnd(2, 5),
              col: o.t === "wire" ? "#555" : "#3a3332",
              t: "rect",
              rot: rnd(TAU),
              vr: rnd(-10, 10),
            });
        }
      }
    }
  }
  obs = obs.filter((o) => o.x > -220 && !o.dead);
  // pickups
  for (const p of pick_) {
    p.x -= sp;
    p.bob += dt * 3;
    if (G.state === "play" && ov(pb, { x: p.x - 20, y: p.y - 22 + Math.sin(p.bob) * 5, w: 40, h: 44 })) {
      p.got = 1;
      if (p.kind === "weapon") {
        giveWeapon(p.w);
        sfxPickup("weapon");
      } else if (p.kind === "med") {
        P.hp = Math.min(100, P.hp + 40);
        toast("+40 VIDA");
        sfxPickup("med");
      } else {
        const own = WORDER.filter((k) => k !== "pistol" && P.arms[k].own);
        if (own.length) {
          const id = P.cur !== "pistol" ? P.cur : pick(own);
          P.arms[id].res += Math.ceil(WEAP[id].pack * 0.6);
          toast("+ MUNICIÓN · " + WEAP[id].n);
        } else {
          giveWeapon(pick(["smg", "shotgun", "rifle"]));
        }
        sfxPickup("ammo");
        refreshWeaponUI();
      }
      for (let i = 0; i < 14; i++)
        part({
          x: p.x,
          y: p.y,
          vx: rnd(-200, 200),
          vy: rnd(-200, 100),
          life: 0.5,
          col: p.kind === "med" ? "#ff6060" : "#ffd27a",
          t: "spark",
          add: 1,
        });
    }
  }
  pick_ = pick_.filter((p) => p.x > -60 && !p.got);
  // zombies
  for (const z of zs) {
    if (z.dead) {
      z.dead += dt;
      z.flash -= dt;
      z.x -= sp;
      continue;
    }
    z.flash -= dt;
    z.atk -= dt;
    z.ph += dt * z.an;
    let vx = -(G.speed + z.spd);
    z.fd = -1;
    if (G.arena) {
      z.fd = P.x > z.x + 10 ? 1 : -1;
      vx = z.fd * (z.spd + 55);
    }
    if (z.type === "spitter" && z.hold > 0 && z.x < VW - 110) {
      vx = -z.spd;
      z.hold -= dt;
      z.shot -= dt;
      if (z.shot <= 0) {
        z.shot = rnd(1.4, 2);
        z.spit = 0.4;
        lob(z.x - 10, GROUND - 80, P.x + rnd(-40, 60), rnd(0.7, 0.9), "acid", 10);
        sfxAcid(panOf(z.x));
      }
    }
    if (z.spit > 0) z.spit -= dt;
    z.x += vx * dt + z.kb * dt * 6;
    z.kb *= Math.pow(0.02, dt);
    if (z.burn > 0) {
      z.burn -= dt;
      z.hp -= 18 * dt;
      if (Math.random() < 0.6)
        part({
          x: z.x + rnd(-12, 12),
          y: GROUND - z.h * rnd(0.2, 0.9),
          vx: rnd(-30, 30),
          vy: rnd(-150, -60),
          life: rnd(0.3, 0.6),
          s: rnd(5, 10),
          s2: 2,
          col: pick(["#ff9a3c", "#ffcc66"]),
          t: "fire",
          add: 1,
        });
      if (z.hp <= 0) killZ(z, 0, false);
    }
    if (G.state === "play" && !z.dead && z.atk <= 0 && ov(pb, zbox(z))) {
      hurtPlayer(z.dmg);
      z.atk = 1.1;
      z.kb = 60;
      sfxGroan(panOf(z.x), 1, 0, true);
    }
    if (z.x < -50 && Math.random() < 0.01) {
    }
  }
  zs = zs.filter((z) => z.x > -140 && !(z.dead > 1.8) && !(z.gib && z.dead));
  // boss
  if (G.boss) updateBoss(G.boss, dt);
  // bullets
  for (const b of bul) {
    b.life -= dt;
    if (b.t === "flame") {
      b.vx *= Math.pow(0.25, dt);
      b.vy -= 60 * dt;
    }
    if (b.t === "rocket") {
      b.vx *= 1 + dt * 1.6;
      if (Math.random() < 0.9)
        part({
          x: b.x - 8,
          y: b.y,
          vx: rnd(-80, -20),
          vy: rnd(-30, 30),
          dr: 2,
          life: rnd(0.5, 1),
          s: 5,
          s2: 18,
          col: "rgba(90,85,85,.4)",
          t: "smoke",
        });
      part({
        x: b.x - 10,
        y: b.y,
        vx: -200,
        vy: rnd(-20, 20),
        life: 0.08,
        s: 7,
        s2: 2,
        col: "#ffcc66",
        t: "fire",
        add: 1,
      });
      light(b.x, b.y, 90, "255,170,90", 0.5);
    }
    const nx = b.x + b.vx * dt,
      ny = b.y + b.vy * dt;
    // hit zombies (swept along x)
    const minx = Math.min(b.x, nx),
      maxx = Math.max(b.x, nx);
    for (const z of zs) {
      if (z.dead || b.life <= 0) continue;
      if (b.hit && b.hit.includes(z)) continue;
      const zb = zbox(z);
      if (maxx >= zb.x && minx <= zb.x + zb.w && ny >= zb.y && ny <= zb.y + zb.h) {
        if (b.t === "flame") {
          z.hp -= b.dmg * dt * 1.0;
          z.burn = Math.max(z.burn, 2.2);
          z.flash = 0.03;
          if (z.hp <= 0) killZ(z, 0, false);
          continue;
        }
        if (b.t === "rocket") {
          b.life = 0;
          explode(b.x, ny, 140, b.dmg, "player");
          break;
        }
        hurtZ(z, b.dmg, clamp(nx, zb.x, zb.x + zb.w), ny, b.vx);
        if (b.pierce > 0) {
          b.pierce--;
          (b.hit || (b.hit = [])).push(z);
        } else {
          b.life = 0;
        }
      }
    }
    const bs = G.boss;
    if (bs && !bs.dying && b.life > 0) {
      const bb = { x: bs.x - bs.w / 2, y: bs.y - bs.h, w: bs.w, h: bs.h };
      if (maxx >= bb.x && minx <= bb.x + bb.w && ny >= bb.y && ny <= bb.y + bb.h) {
        if (b.t === "flame") {
          if (Math.random() < 0.5) hurtBoss(bs, b.dmg * dt * 2, bb.x + 10, ny);
        } else if (b.t === "rocket") {
          b.life = 0;
          explode(bb.x + 20, ny, 140, b.dmg, "player");
        } else {
          hurtBoss(bs, b.dmg, b.vx > 0 ? bb.x + rnd(4, 20) : bb.x + bb.w - rnd(4, 20), ny);
          if (b.pierce > 0) b.pierce = 0;
          b.life = 0;
        }
      }
    }
    for (const o of obs) {
      if (o.t !== "barrel" || o.hit || b.life <= 0) continue;
      if (maxx >= o.x - 16 && minx <= o.x + 16 && ny > GROUND - 50) {
        if (b.t === "flame") {
          o.hp -= 60 * dt;
        } else {
          o.hp -= b.dmg;
          b.life = b.pierce > 0 ? b.life : 0;
        }
        part({
          x: o.x - 14,
          y: ny,
          vx: -200,
          vy: rnd(-100, 100),
          life: 0.12,
          col: "#ffd27a",
          t: "spark",
          add: 1,
        });
        if (o.hp <= 0) {
          o.hit = 1;
          o.boomT = 0.02;
        }
      }
    }
    b.x = nx;
    b.y = ny;
    if (b.t === "rocket" && b.life > 0 && (b.y > GROUND || b.x > VW + 40 || b.x < -40)) {
      if (b.y > GROUND) explode(b.x, GROUND - 10, 140, b.dmg, "player");
      b.life = 0;
    }
    if (b.t !== "flame" && b.y > GROUND + 4 && b.life > 0) {
      b.life = 0;
      for (let i = 0; i < 3; i++)
        part({
          x: b.x,
          y: GROUND,
          vx: rnd(-100, 100),
          vy: rnd(-200, -60),
          g: 800,
          life: 0.3,
          col: "#ffcf7a",
          t: "spark",
          add: 1,
        });
    }
  }
  bul = bul.filter((b) => b.life > 0 && b.x < VW + 80 && b.x > -50);
  // enemy projectiles
  for (const e of ep) {
    if (e.delay > 0) {
      e.delay -= dt;
      continue;
    }
    e.life -= dt;
    e.vy += (e.g || 0) * dt;
    if (e.t === "debris") e.vy += 1800 * dt;
    e.x += e.vx * dt;
    e.y += e.vy * dt;
    e.rot = (e.rot || 0) + dt * (e.t === "cleaver" ? 14 : e.t === "boulder" ? -e.vx / 30 : 3);
    if (e.t === "shock") {
      if (Math.random() < 0.8)
        part({
          x: e.x + rnd(-20, 20),
          y: GROUND - rnd(0, e.h),
          vx: rnd(-60, 60) + e.vx * 0.2,
          vy: rnd(-160, -40),
          life: rnd(0.3, 0.6),
          s: rnd(4, 8),
          s2: rnd(16, 28),
          col: "rgba(100,88,80,.35)",
          t: "smoke",
        });
    }
    if (e.t === "acid" || e.t === "bolt") {
      if (Math.random() < 0.5)
        part({
          x: e.x,
          y: e.y,
          vx: rnd(-30, 30),
          vy: rnd(-30, 30),
          life: 0.3,
          s: 4,
          s2: 1,
          col: "#b5ff4a",
          t: "dot",
          add: 1,
        });
    }
    // hit player
    const pb2 = pbox();
    if (G.state === "play" && !e.done) {
      let hit = false;
      if (e.t === "shock") hit = ov(pb2, { x: e.x - e.w / 2, y: GROUND - e.h, w: e.w, h: e.h });
      else hit = ov(pb2, { x: e.x - e.r, y: e.y - e.r, w: e.r * 2, h: e.r * 2 });
      if (hit) {
        hurtPlayer(e.dmg);
        if (e.t !== "shock" && e.t !== "boulder") {
          e.done = 1;
          if (e.t === "acid" || e.t === "bolt") {
            for (let i = 0; i < 10; i++)
              part({
                x: e.x,
                y: e.y,
                vx: rnd(-200, 200),
                vy: rnd(-200, 50),
                g: 900,
                life: 0.5,
                s: 3,
                col: "#8fd12a",
                t: "blood",
              });
            sfxAcid(panOf(e.x));
          }
        }
      }
    }
    // ground
    if ((e.t === "acid" || e.t === "cleaver" || e.t === "debris") && e.y >= GROUND - 6 && !e.done) {
      e.done = 1;
      if (e.t === "acid") {
        puddles.push({ x: e.x, w: rnd(70, 100), life: 3 });
        sfxAcid(panOf(e.x));
        for (let i = 0; i < 12; i++)
          part({
            x: e.x,
            y: GROUND - 4,
            vx: rnd(-220, 220),
            vy: rnd(-260, -60),
            g: 900,
            life: 0.6,
            s: rnd(2, 4),
            col: "#8fd12a",
            t: "blood",
          });
      } else {
        sfxLand();
        G.shake = Math.max(G.shake, e.t === "debris" ? 8 : 3);
        for (let i = 0; i < 10; i++)
          part({
            x: e.x,
            y: GROUND,
            vx: rnd(-200, 200),
            vy: rnd(-250, -60),
            g: 1000,
            life: rnd(0.4, 0.8),
            s: rnd(2, 5),
            col: "#3a3332",
            t: "rect",
            rot: rnd(TAU),
            vr: rnd(-10, 10),
          });
        for (let i = 0; i < 6; i++)
          part({
            x: e.x,
            y: GROUND,
            vx: rnd(-120, 120),
            vy: rnd(-80, -20),
            life: 0.7,
            s: 6,
            s2: 22,
            col: "rgba(90,80,75,.4)",
            t: "smoke",
          });
      }
    }
  }
  ep = ep.filter((e) => !e.done && e.life > 0 && e.x > -120 && e.x < VW + 200);
  // puddles
  for (const p of puddles) {
    p.x -= sp;
    p.life -= dt;
    if (Math.random() < 0.3)
      part({
        x: p.x + rnd(-p.w / 2, p.w / 2),
        y: GROUND + 2,
        vx: 0,
        vy: rnd(-50, -20),
        life: 0.6,
        s: 3,
        s2: 7,
        col: "rgba(150,220,60,.25)",
        t: "smoke",
      });
    if (G.state === "play" && P.ground && Math.abs(P.x - p.x) < p.w / 2) hurtPlayer(8);
  }
  puddles = puddles.filter((p) => p.life > 0 && p.x > -100);
  for (const d of decals) d.x -= sp;
  decals = decals.filter((d) => d.x > -100);
  // particles
  for (const p of parts) {
    p.life -= dt;
    if (p.dr) (p.vx *= Math.pow(1 / (1 + p.dr), dt)), (p.vy *= Math.pow(1 / (1 + p.dr), dt));
    p.vy += p.g * dt;
    p.x += p.vx * dt - sp * p.sf;
    p.y += p.vy * dt;
    p.rot += p.vr * dt;
    if (p.t === "fire" || p.t === "smoke") {
      p.vy -= (p.t === "fire" ? 40 : 20) * dt;
    }
    if ((p.t === "blood" || p.t === "rect" || p.t === "shell") && p.y > GROUND + 2 && p.vy > 0) {
      if (p.t === "blood") {
        p.life = 0;
        if (Math.random() < 0.12 && decals.length < 45)
          decals.push({ x: p.x, y: GROUND + rnd(2, 14), r: rnd(4, 10), c: "rgba(80,6,6,.5)" });
      } else if (p.b > 0) {
        p.y = GROUND + 2;
        p.vy *= -0.35;
        p.vx *= 0.5;
        p.vr *= 0.5;
        p.b--;
        if (p.t === "shell") sfxShell();
      } else {
        p.y = GROUND + 2;
        p.vy = 0;
        p.vx = 0;
        p.vr = 0;
      }
    }
  }
  parts = parts.filter((p) => p.life > 0);
  for (const f of floats) {
    f.life -= dt * 1.6;
    f.y -= dt * 40;
    f.x -= sp * 0.5;
  }
  floats = floats.filter((f) => f.life > 0);
  // ash
  while (ash.length < 70)
    ash.push({
      x: rnd(VW + 200),
      y: rnd(-20, VH),
      vx: rnd(-40, -10),
      vy: rnd(15, 45),
      s: rnd(0.8, 2.2),
      a: rnd(0.2, 0.6),
      ph: rnd(TAU),
      ember: Math.random() < 0.15,
    });
  for (const a of ash) {
    a.x += (a.vx - G.speed * 0.25) * dt;
    a.y += a.vy * dt;
    a.ph += dt * 2;
    a.x += Math.sin(a.ph) * 8 * dt;
    if (a.y > VH || a.x < -20) {
      a.x = rnd(VW, VW + 200);
      a.y = rnd(-20, VH * 0.8);
    }
  }
  // tutorial hints
  hintTick();
  if (G.state === "play") {
    const t = G.t;
    if (!store.tut && !G.boss) {
      if (t > 3 && t < 3.1) hint(isTouch ? "Mantén FUEGO para disparar" : "Mantén J o clic para disparar", 3);
      if (t > 7 && t < 7.1) hint("Salta los obstáculos · deslízate bajo las vigas", 3.2);
      if (t > 11 && t < 11.1) hint("Recoge cajas de armas y botiquines", 3);
      if (t > 15) (store.tut = 1), save();
    }
  }
}
</script>
<script>
"use strict";
/* ================== DRAW ================== */
function limb(x1, y1, x2, y2, w, c) {
  ctx.strokeStyle = c;
  ctx.lineWidth = w;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}
function limb3(x1, y1, x2, y2, x3, y3, w, c) {
  ctx.strokeStyle = c;
  ctx.lineWidth = w;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.lineTo(x3, y3);
  ctx.stroke();
}
function leg(hx, hy, sw, bend, L) {
  const kx = hx + Math.sin(sw) * L,
    ky = hy + Math.cos(sw) * L;
  const a2 = sw - bend;
  return [kx, ky, kx + Math.sin(a2) * L, ky + Math.cos(a2) * L];
}
function circ(x, y, r, c) {
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.fill();
}
function ell(x, y, rx, ry, c, rot) {
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU);
  ctx.fill();
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
/** Segmento cónico (cápsula) de grosor w1 a w2: extremidades con volumen. */
function seg(x1, y1, x2, y2, w1, w2, c) {
  const dx = x2 - x1,
    dy = y2 - y1,
    l = Math.hypot(dx, dy) || 0.001,
    nx = -dy / l,
    ny = dx / l,
    an = Math.atan2(ny, nx);
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.moveTo(x1 + (nx * w1) / 2, y1 + (ny * w1) / 2);
  ctx.lineTo(x2 + (nx * w2) / 2, y2 + (ny * w2) / 2);
  ctx.arc(x2, y2, w2 / 2, an, an + PI, true);
  ctx.lineTo(x1 - (nx * w1) / 2, y1 - (ny * w1) / 2);
  ctx.arc(x1, y1, w1 / 2, an + PI, an, true);
  ctx.fill();
}
function shadow(x, w, a) {
  ctx.fillStyle = `rgba(0,0,0,${a || 0.45})`;
  ctx.beginPath();
  ctx.ellipse(x, GROUND + 2, w, w * 0.18, 0, 0, TAU);
  ctx.fill();
}

function drawGun(c, id, sc) {
  c.save();
  if (sc) c.scale(sc, sc);
  const dk = "#1b1c1f",
    md = "#2c2e33",
    lt = "#4a4d55",
    wd = "#5a3a22",
    wd2 = "#6e4729";
  const R = (x, y, w, h, col) => {
    c.fillStyle = col;
    c.fillRect(x, y, w, h);
  };
  switch (id) {
    case "pistol":
      R(-2, -5, 19, 5, md);
      R(-2, -5, 19, 1.5, lt);
      R(-1, 0, 5, 8, dk);
      R(4, 0, 3, 2, dk);
      break;
    case "smg":
      R(-10, -3, 6, 3, dk);
      R(-4, -6, 22, 7, md);
      R(-4, -6, 22, 1.5, lt);
      R(18, -4.5, 8, 3, dk);
      R(4, 1, 4, 9, dk);
      R(-1, 1, 4, 7, dk);
      break;
    case "rifle":
      c.fillStyle = wd;
      c.beginPath();
      c.moveTo(-16, -4);
      c.lineTo(-2, -5);
      c.lineTo(-2, 1);
      c.lineTo(-16, 4);
      c.closePath();
      c.fill();
      R(-2, -6, 24, 7, md);
      R(-2, -6, 24, 1.5, lt);
      R(14, -5, 10, 5, wd2);
      R(24, -4, 14, 2.5, dk);
      R(34, -7, 2, 3, dk);
      c.fillStyle = dk;
      c.beginPath();
      c.moveTo(6, 1);
      c.lineTo(11, 1);
      c.quadraticCurveTo(14, 8, 10, 13);
      c.lineTo(6, 12);
      c.quadraticCurveTo(9, 7, 6, 1);
      c.fill();
      R(0, 1, 4, 7, dk);
      break;
    case "shotgun":
      R(-16, -4, 14, 7, wd);
      R(-2, -5, 18, 6, md);
      R(-2, -5, 18, 1.5, lt);
      R(16, -5, 24, 3, dk);
      R(16, -2, 20, 3, md);
      R(18, -2.5, 12, 5, wd2);
      R(0, 1, 4, 6, dk);
      break;
    case "sniper":
      R(-18, -4, 16, 8, "#2b3326");
      R(-2, -5, 30, 6, "#323a2c");
      R(-2, -5, 30, 1.5, "#4b5644");
      R(28, -4, 22, 2.5, dk);
      R(2, -11, 18, 4, dk);
      circ(2, -9, 2.6, dk);
      circ(20, -9, 3, dk);
      glowDot(c, 21, -9, "111,227,255");
      R(8, 1, 4, 7, dk);
      R(30, 1, 1.5, 8, dk);
      R(34, 1, 1.5, 8, dk);
      break;
    case "flamer":
      R(-6, -6, 22, 9, "#3d3a30");
      R(-6, -6, 22, 2, "#5a5646");
      R(16, -4, 18, 4, dk);
      R(30, -5, 4, 6, "#555");
      R(2, 3, 4, 7, dk);
      c.fillStyle = "#7a2a1a";
      c.fillRect(-14, -8, 8, 14);
      glowDot(c, 35, -2, "90,160,255");
      break;
    case "rocket":
      R(-22, -6, 66, 10, "#3b4430");
      R(-22, -6, 66, 2, "#566246");
      R(-24, -7, 4, 12, dk);
      R(40, -7, 4, 12, dk);
      c.fillStyle = "#4a5038";
      c.beginPath();
      c.moveTo(44, -6);
      c.lineTo(52, -3);
      c.lineTo(52, 0);
      c.lineTo(44, 4);
      c.fill();
      R(0, 4, 4, 8, dk);
      R(10, 4, 4, 7, dk);
      R(4, -11, 8, 5, dk);
      break;
  }
  c.restore();
}
function glowDot(c, x, y, col) {
  c.save();
  c.globalCompositeOperation = "lighter";
  const g = c.createRadialGradient(x, y, 0, x, y, 5);
  g.addColorStop(0, `rgba(${col},.9)`);
  g.addColorStop(1, `rgba(${col},0)`);
  c.fillStyle = g;
  c.fillRect(x - 5, y - 5, 10, 10);
  c.restore();
}

/* ================== PERSONAJES ==================
 * Rediseño: las extremidades dejan de ser trazos planos de grosor constante y pasan a ser
 * segmentos cónicos con volumen (muslo > tobillo, brazo > muñeca); torsos como formas con
 * hombros, pecho y cintura; cabezas con cráneo + mandíbula. Todo se compone después con
 * contorno, sombreado y rim light (ver fx.js), de modo que la silueta se lee en cualquier fondo.
 */
function drawPlayer() {
  const p = P,
    hgt = GROUND - p.y;
  // sombra de contacto (en la escena, no en el personaje)
  ctx.fillStyle = `rgba(0,0,0,${0.55 * clamp(1 - hgt / 220, 0.15, 1)})`;
  ctx.beginPath();
  ctx.ellipse(p.x, GROUND + 2, 26 * (1 - hgt / 450), 5.5, 0, 0, TAU);
  ctx.fill();
  const blink = p.inv > 0 && !p.dead && ((G.t * 18) | 0) % 2;
  // caja ajustada al cuerpo: el coste del compositor es proporcional a su área
  const hw = p.dead ? 135 : 96;
  drawActor(p.x - hw, p.y - 128, hw * 2, 142, playerBody, { alpha: blink ? 0.4 : 1 });
}
const PC = {
  pants: "#323a44",
  pantsD: "#222830",
  knee: "#171b20",
  boot: "#17120f",
  bootL: "#3a302a",
  jk: "#5d6a42",
  jkD: "#3e4730",
  jkL: "#83915e",
  vest: "#262b2d",
  vestL: "#40484a",
  strap: "#1c1712",
  glove: "#201d1a",
  helm: "#465039",
  helmL: "#6c7a54",
  mask: "#16181b",
  scarf: "#c42a1f",
  scarfD: "#7f1912",
  pack: "#54452f",
  packD: "#3a2f20",
};
function boot(x, y, dir, col, colL) {
  // bota con puntera y talón (antes: un trazo)
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(x - 4, y - 5);
  ctx.lineTo(x + 3, y - 5);
  ctx.quadraticCurveTo(x + 10 * dir, y - 4, x + 11 * dir, y + 1);
  ctx.lineTo(x - 5, y + 2);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = colL;
  ctx.fillRect(x - 5, y, 16, 2);
}
function playerBody() {
  const p = P;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale((p.face || 1) * CH, CH);
  if (p.dead) ctx.rotate(-Math.min(1, p.dead * 2.5) * 1.45);
  const L = 23,
    ph = p.phase;
  let lf,
    lb,
    hx = 0,
    hy,
    sx,
    sy,
    lean = 0;
  if (p.slide > 0 && !p.dead) {
    lf = [1.5, 0.1];
    lb = [1.15, 1.5];
    hy = -18;
    hx = -2;
    sx = -12;
    sy = -45;
  } else if (!p.ground || p.dead) {
    if (p.dead) {
      lf = [0.75, 1.35];
      lb = [-0.35, 0.75];
    } else if (p.jumps === 2) {
      // doble salto: rodillas recogidas
      lf = [1.35, 2.3];
      lb = [0.7, 2.1];
    } else if (p.vy < 0) {
      lf = [0.95, 1.6];
      lb = [-0.3, 0.8];
    } else {
      // caída: piernas se estiran para aterrizar
      lf = [0.45, 0.75];
      lb = [-0.4, 0.45];
    }
    hy = -48;
    sx = 6;
    sy = -77;
  } else if (p.idle) {
    lf = [0.14 + Math.sin(G.t * 2) * 0.02, 0.12];
    lb = [-0.16, 0.2];
    hy = -L * (Math.cos(0.14) + Math.cos(0.02)) + 1;
    sx = 6;
    sy = hy - 29 + Math.sin(G.t * 2.4) * 0.8;
  } else {
    lf = [Math.sin(ph) * 0.85, Math.max(0, Math.cos(ph)) * 1.45 + 0.12];
    lb = [Math.sin(ph + PI) * 0.85, Math.max(0, Math.cos(ph + PI)) * 1.45 + 0.12];
    const ext = (s) => L * (Math.cos(s[0]) + Math.cos(s[0] - s[1]));
    hy = -Math.max(ext(lf), ext(lb)) + 1;
    lean = 2;
    sx = 8;
    sy = hy - 29 + Math.abs(Math.sin(ph)) * 1.2;
  }
  // aterrizaje: compresión breve
  if (p.land > 0 && !p.dead) {
    const k = p.land / 0.14;
    hy += 5 * k;
    sy += 7 * k;
  }
  p.hipY = hy;
  const legF = leg(hx, hy, lf[0], lf[1], L),
    legB = leg(hx, hy, lb[0], lb[1], L);
  const gp = { x: sx + 14 - p.recoil * 5, y: sy + 9 };
  if (p.cur === "rocket") {
    gp.x = sx + 2 - p.recoil * 5;
    gp.y = sy - 2;
  }
  const a = p.aim;
  const g2 = p.cur === "pistol" ? 3 : 13;
  const grip2 = { x: gp.x + Math.cos(a) * g2, y: gp.y + Math.sin(a) * g2 + 1 };
  const Hx = sx + 4 + lean,
    Hy = sy - 13;
  // ---- bufanda (detrás de todo): ondea según la velocidad ----
  const spd = G.arena ? Math.abs(K.right - K.left) * 0.8 + 0.2 : clamp(G.speed / 330, 0.2, 1.4);
  ctx.fillStyle = PC.scarfD;
  ctx.beginPath();
  const bx0 = Hx - 5,
    by0 = Hy + 9;
  ctx.moveTo(bx0, by0 - 3);
  const pts = [];
  for (let i = 1; i <= 5; i++) {
    const t = i / 5;
    pts.push([
      bx0 - t * (14 + 12 * spd),
      by0 + t * (4 + 10 * (1.4 - spd)) + Math.sin(G.t * 13 - i * 1.3) * (1 + t * 3.5) * spd,
    ]);
  }
  for (const q of pts) ctx.lineTo(q[0], q[1] - 2.6 * (1 - 0.15));
  for (let i = pts.length - 1; i >= 0; i--) ctx.lineTo(pts[i][0], pts[i][1] + 2.6 * (1 - i / 6));
  ctx.lineTo(bx0, by0 + 3);
  ctx.fill();
  // ---- brazo trasero ----
  const ebx = (sx + grip2.x) / 2 - 2,
    eby = (sy + grip2.y) / 2 + 8;
  seg(sx - 2, sy + 2, ebx, eby, 7, 6, PC.jkD);
  seg(ebx, eby, grip2.x, grip2.y, 6, 5, PC.jkD);
  circ(grip2.x, grip2.y, 3.2, PC.glove);
  // ---- pierna trasera ----
  seg(hx, hy, legB[0], legB[1], 10.5, 8.5, PC.pantsD);
  seg(legB[0], legB[1], legB[2], legB[3] - 2, 8.5, 6.5, PC.pantsD);
  boot(legB[2], legB[3] - 1, 1, PC.boot, "#0d0a09");
  // ---- mochila ----
  ctx.save();
  const bx = lerp(hx, sx, 0.55) - 10,
    by = lerp(hy, sy, 0.55);
  ctx.translate(bx, by);
  ctx.rotate(Math.atan2(sx - hx, -(sy - hy)) * 0.9);
  ctx.fillStyle = PC.packD;
  rrect(-8, -14, 15, 28, 4);
  ctx.fill();
  ctx.fillStyle = PC.pack;
  rrect(-8, -14, 11, 26, 4);
  ctx.fill();
  ctx.fillStyle = PC.strap;
  ctx.fillRect(-8, -5, 15, 2.4);
  ctx.fillRect(-8, 4, 15, 2.4);
  ell(-1, -16, 9, 4.8, "#5e5a45"); // saco de dormir
  ctx.strokeStyle = PC.strap;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(-5, -20);
  ctx.lineTo(-5, -12);
  ctx.moveTo(3, -20);
  ctx.lineTo(3, -12);
  ctx.stroke();
  ctx.restore();
  // ---- torso: chaqueta con hombros, pecho y cintura ----
  const ux = sx - hx,
    uy = sy - hy,
    ul = Math.hypot(ux, uy) || 1;
  const nx = -uy / ul,
    ny = ux / ul; // normal hacia delante
  const P2 = (t, o) => [lerp(hx, sx, t) + nx * o, lerp(hy, sy, t) + ny * o];
  const poly = (arr, col) => {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(arr[0][0], arr[0][1]);
    for (let i = 1; i < arr.length; i++) ctx.lineTo(arr[i][0], arr[i][1]);
    ctx.closePath();
    ctx.fill();
  };
  poly([P2(-0.05, -7.5), P2(0.55, -8.5), P2(1.02, -9), P2(1.08, 4), P2(0.95, 10), P2(0.6, 10.5), P2(0.2, 8), P2(-0.05, 7)], PC.jk);
  // chaleco táctico
  poly([P2(0.22, -7.5), P2(0.95, -8), P2(0.98, 3), P2(0.85, 10.8), P2(0.25, 9)], PC.vest);
  poly([P2(0.3, 4), P2(0.85, 4.5), P2(0.82, 10.6), P2(0.3, 9.2)], PC.vestL);
  // portacargadores
  for (let i = 0; i < 2; i++) {
    const q = P2(0.38 + i * 0.2, 9.5);
    ctx.fillStyle = "#1b1f20";
    ctx.save();
    ctx.translate(q[0], q[1]);
    ctx.rotate(Math.atan2(ny, nx));
    rrect(-1.5, -3.5, 5, 7, 1.5);
    ctx.fill();
    ctx.restore();
  }
  // cinturón
  const b1 = P2(0.04, -8),
    b2 = P2(0.04, 8);
  ctx.strokeStyle = PC.strap;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(b1[0], b1[1]);
  ctx.lineTo(b2[0], b2[1]);
  ctx.stroke();
  const bk = P2(0.04, 5);
  ctx.fillStyle = "#8c8066";
  ctx.fillRect(bk[0] - 1.6, bk[1] - 1.8, 3.2, 3.6);
  // ---- pierna delantera ----
  seg(hx, hy, legF[0], legF[1], 11.5, 9, PC.pants);
  seg(legF[0], legF[1], legF[2], legF[3] - 2, 9, 7, PC.pants);
  ell(legF[0] + 1.5, legF[1] + 1, 5, 4.2, PC.knee, Math.atan2(legF[1] - hy, legF[0] - hx));
  boot(legF[2], legF[3] - 1, 1, PC.boot, "#0d0a09");
  // ---- cabeza: casco, máscara con visor y filtro ----
  seg(sx + 1, sy + 2, Hx, Hy + 6, 7, 6, PC.mask);
  ell(Hx - 1, Hy + 9, 8, 4, PC.scarf, -0.2); // bufanda al cuello
  circ(Hx, Hy, 10, PC.mask);
  ctx.fillStyle = PC.helm;
  ctx.beginPath();
  ctx.arc(Hx - 0.5, Hy - 0.5, 11, PI * 0.95, PI * 2.08);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = PC.helmL;
  ctx.beginPath();
  ctx.arc(Hx - 1, Hy - 1, 9.4, PI * 1.15, PI * 1.6);
  ctx.lineTo(Hx - 1, Hy - 3);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#2e3527";
  ctx.fillRect(Hx - 11, Hy - 1.2, 23, 2.6); // ala del casco
  // visor
  ctx.fillStyle = "#0b0d10";
  rrect(Hx + 1.5, Hy + 1.2, 10, 5, 2.2);
  ctx.fill();
  ctx.fillStyle = "#8ff0ff";
  rrect(Hx + 3, Hy + 2.2, 7.5, 2.4, 1.2);
  ctx.fill();
  glow(Hx + 7, Hy + 3.4, 10, "111,227,255", 0.6);
  // filtro respirador
  circ(Hx + 8.5, Hy + 9, 3.6, "#3c3f43");
  circ(Hx + 9.2, Hy + 9, 1.6, "#1d1e21");
  // ---- arma ----
  ctx.save();
  ctx.translate(gp.x, gp.y);
  ctx.rotate(a);
  drawGun(ctx, p.cur);
  ctx.restore();
  // ---- brazo delantero con hombrera ----
  const efx = (sx + gp.x) / 2 - 3,
    efy = (sy + gp.y) / 2 + 7;
  seg(sx + 1, sy + 2, efx, efy, 8.5, 7, PC.jk);
  seg(efx, efy, gp.x + 1, gp.y + 2, 7, 6, PC.jk);
  ell(sx + 2, sy + 1, 6.2, 5, PC.jkL, -0.3);
  circ(gp.x + 1, gp.y + 2, 3.6, PC.glove);
  if (p.cur === "flamer") glow(gp.x + Math.cos(a) * 35, gp.y + Math.sin(a) * 35 - 2, 8, "80,150,255", 0.6);
  ctx.restore();
}

function drawZombie(z) {
  if (!z.dead) shadow(z.x, z.w * 0.65, 0.42);
  let alpha = 1;
  if (z.dead > 1.1) alpha = Math.max(0, 1 - (z.dead - 1.1) / 0.7);
  if (alpha <= 0) return;
  const hw = z.dead ? z.h + 24 : 52 * z.s + 10,
    top = z.h * 1.12 + 24;
  drawActor(z.x - hw, GROUND - z.yo - top, hw * 2, top + 12, () => zombieBody(z), {
    alpha,
    rim: z.flash > 0 ? 0 : undefined,
  });
}
/** Mano en garra: tres dedos cortos (lectura de amenaza a distancia). */
function claw(x, y, ang, s, col) {
  ctx.strokeStyle = col;
  ctx.lineWidth = 1.8 * s;
  ctx.beginPath();
  for (let i = -1; i <= 1; i++) {
    const a2 = ang + i * 0.45;
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a2) * 5 * s, y + Math.sin(a2) * 5 * s);
  }
  ctx.stroke();
  circ(x, y, 2.6 * s, col);
}
function zombieBody(z) {
  const s = z.s;
  const fl = z.flash > 0;
  const C = (c) => (fl ? "#efe8de" : c);
  ctx.save();
  ctx.translate(z.x, GROUND - z.yo);
  const FS = z.fd === 1 ? 1 : -1;
  ctx.scale(FS, 1);
  if (z.dead) {
    const f = Math.min(1, z.dead * 2.6);
    ctx.rotate(-f * (z.type === "crawler" ? 0.2 : 1.42));
  }
  const skin = C(z.skin),
    skinD = C(shade(z.skin, -0.28)),
    skinL = C(shade(z.skin, 0.18)),
    cl = C(z.cloth),
    clD = C(shade(z.cloth, -0.32)),
    blood = fl ? "#efe8de" : "#4a0707",
    eye = fl ? "#fff" : z.type === "runner" ? "#ff4a3a" : "#ffd34d";
  const L = 22 * s,
    ph = z.ph;
  if (z.type === "crawler") {
    const hx = -18 * s,
      hy = -9 * s,
      sx = 10 * s,
      sy = -14 * s;
    // muñones de las piernas arrastrándose
    seg(hx, hy, hx - 16 * s, hy + 3 * s, 9 * s, 7 * s, clD);
    seg(hx - 16 * s, hy + 3 * s, hx - 30 * s, -3 * s, 7 * s, 5 * s, clD);
    seg(hx, hy, hx - 18 * s, hy + 1 * s, 9 * s, 7 * s, cl);
    seg(hx - 18 * s, hy + 1 * s, hx - 33 * s, -6 * s, 7 * s, 5 * s, cl);
    seg(hx, hy, sx, sy, 12 * s, 15 * s, cl);
    seg(hx + 6 * s, hy - 4 * s, sx - 4 * s, sy - 4 * s, 3 * s, 3 * s, blood);
    const r1 = Math.sin(ph),
      r2 = Math.sin(ph + PI);
    const e1x = sx + 10 * s + r1 * 5 * s,
      e1y = sy - 8 * s;
    seg(sx, sy, e1x, e1y, 6 * s, 5 * s, skinD);
    seg(e1x, e1y, sx + 20 * s + r1 * 8 * s, -2 * s, 5 * s, 4 * s, skinD);
    claw(sx + 20 * s + r1 * 8 * s, -2 * s, 0.4, s, skinD);
    // cabeza
    circ(sx + 10 * s, sy - 4 * s, 8.5 * s, skin);
    ell(sx + 14 * s, sy + 1.5 * s, 5 * s, 3.4 * s, skinD);
    ctx.fillStyle = fl ? "#fff" : "#1d0606";
    ctx.fillRect(sx + 12 * s, sy + 1 * s, 6 * s, 2.2 * s);
    ell(sx + 13 * s, sy - 6 * s, 2.6 * s, 2.2 * s, fl ? "#fff" : "#1a0d0d");
    circ(sx + 13.5 * s, sy - 6 * s, 1.5 * s, eye);
    glow(sx + 13.5 * s, sy - 6 * s, 7, "255,200,60", fl || z.dead ? 0 : 0.35);
    const e2x = sx + 12 * s + r2 * 5 * s,
      e2y = sy - 6 * s;
    seg(sx, sy, e2x, e2y, 6.5 * s, 5.5 * s, skin);
    seg(e2x, e2y, sx + 22 * s + r2 * 8 * s, -2 * s, 5.5 * s, 4.5 * s, skin);
    claw(sx + 22 * s + r2 * 8 * s, -2 * s, 0.4, s, skin);
    ctx.restore();
    return;
  }
  const big = z.type === "bloater";
  const run = z.type === "runner";
  const arm = z.type === "armored";
  const amp = run ? 0.8 : 0.5;
  const sw1 = Math.sin(ph) * amp,
    b1 = Math.max(0, Math.cos(ph)) * (run ? 1.4 : 0.9) + 0.2;
  const sw2 = Math.sin(ph + PI) * amp * 0.8,
    b2 = Math.max(0, Math.cos(ph + PI)) * (run ? 1.4 : 0.7) + 0.2;
  const ext = (a, b) => L * (Math.cos(a) + Math.cos(a - b));
  const hx = 0,
    hy = z.dead ? -L * 1.9 : -Math.max(ext(sw1, b1), ext(sw2, b2)) + 1;
  // balanceo de cuerpo pesado al andar (cojera)
  const sway = run ? 0 : Math.sin(ph) * 2.2 * s;
  const lean = (run ? 18 : 12) * s + z.lean * 10 + sway;
  const sx = lean,
    sy = hy - 27 * s * (big ? 1.05 : 1) + Math.abs(Math.cos(ph)) * 1.5 * s;
  const lf = leg(hx, hy, sw1, b1, L),
    lb = leg(hx, hy, sw2, b2, L);
  const lw = (run ? 8 : 9.5) * s * (big ? 1.25 : 1);
  const reach = z.spit > 0 ? -0.5 : 1;
  const a1 = Math.sin(ph * 0.5) * 4 * s;
  // ---- brazo trasero ----
  {
    const ex = sx + 10 * s,
      ey = sy + 10 * s + a1,
      wx = sx + 24 * s * reach,
      wy = sy + 6 * s + a1;
    seg(sx - 2 * s, sy + 2 * s, ex, ey, lw * 0.78, lw * 0.62, skinD);
    seg(ex, ey, wx, wy, lw * 0.62, lw * 0.5, skinD);
    claw(wx, wy, -0.1, s, skinD);
  }
  // ---- pierna trasera ----
  seg(hx, hy, lb[0], lb[1], lw * 1.1, lw * 0.85, clD);
  seg(lb[0], lb[1], lb[2], lb[3] - 2, lw * 0.85, lw * 0.6, clD);
  boot(lb[2], lb[3] - 1, 1, "#151314", "#0c0b0b");
  // ---- torso: camisa rasgada ----
  const ux = sx - hx,
    uy = sy - hy,
    ul = Math.hypot(ux, uy) || 1,
    nx = -uy / ul,
    ny = ux / ul;
  const W = (run ? 6.5 : 7.5) * s * (big ? 1.4 : 1);
  const P2 = (t, o) => [lerp(hx, sx, t) + nx * o, lerp(hy, sy, t) + ny * o];
  const pts = [P2(-0.05, -W), P2(0.6, -W * 1.05), P2(1.02, -W * 1.1), P2(1.06, W * 0.6), P2(0.9, W * 1.25), P2(0.45, W * 1.15)];
  // bajo deshilachado
  for (let i = 4; i >= 0; i--) pts.push(P2(i % 2 ? -0.12 : -0.02, -W + (W * 2 * i) / 4));
  ctx.fillStyle = arm ? C("#252b33") : cl;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (const q of pts) ctx.lineTo(q[0], q[1]);
  ctx.closePath();
  ctx.fill();
  if (arm) {
    // chaleco antidisturbios con placas
    ctx.fillStyle = C("#3a4552");
    for (let i = 0; i < 3; i++) {
      const q = P2(0.25 + i * 0.25, 0);
      ctx.save();
      ctx.translate(q[0], q[1]);
      ctx.rotate(Math.atan2(uy, ux) + PI / 2);
      rrect(-W * 0.9, -4 * s, W * 1.9, 7 * s, 2 * s);
      ctx.fill();
      ctx.restore();
    }
    const q = P2(0.6, W * 0.4);
    ctx.fillStyle = C("#c8b04a");
    ctx.font = `700 ${5 * s}px Rajdhani,sans-serif`;
    ctx.save();
    ctx.translate(q[0], q[1]);
    ctx.rotate(Math.atan2(uy, ux) + PI / 2);
    ctx.fillText("POLICÍA", -W * 0.8, 1.6 * s);
    ctx.restore();
  } else {
    // costillas expuestas por la herida
    const q = P2(0.55, W * 0.45);
    ell(q[0], q[1], 3.8 * s, 6.4 * s, skinD, Math.atan2(uy, ux));
    ctx.strokeStyle = fl ? "#fff" : "rgba(220,200,180,.55)";
    ctx.lineWidth = 1.2 * s;
    for (let i = 0; i < 3; i++) {
      const r = P2(0.45 + i * 0.1, W * 0.25),
        r2 = P2(0.45 + i * 0.1, W * 0.75);
      ctx.beginPath();
      ctx.moveTo(r[0], r[1]);
      ctx.lineTo(r2[0], r2[1]);
      ctx.stroke();
    }
    const bl = P2(0.28, -W * 0.3);
    ell(bl[0], bl[1], 4.5 * s, 3.2 * s, blood);
    const bl2 = P2(0.85, W * 0.6);
    ell(bl2[0], bl2[1], 3 * s, 4 * s, blood);
  }
  if (big) {
    const bx = lerp(hx, sx, 0.5) + 9 * s,
      by = lerp(hy, sy, 0.5) + 4 * s;
    const pulse = 1 + Math.sin(G.t * 6 + z.ph) * 0.04;
    ell(bx, by, 21 * s * pulse, 23 * s * pulse, C("#6f7d4a"));
    ell(bx - 5 * s, by - 6 * s, 12 * s * pulse, 12 * s * pulse, C("#93a06a"));
    for (let i = 0; i < 5; i++) {
      const a = i * 1.3 + 0.4,
        px = bx + Math.cos(a) * 14 * s,
        py = by + Math.sin(a) * 15 * s;
      circ(px, py, (2.5 + (i % 2)) * s, fl ? "#fff" : "#c6ff4d");
    }
    glow(bx, by, 40 * s, "160,255,60", fl || z.dead ? 0 : 0.12);
  }
  // ---- pierna delantera ----
  seg(hx, hy, lf[0], lf[1], lw * 1.15, lw * 0.9, cl);
  seg(lf[0], lf[1], lf[2], lf[3] - 2, lw * 0.9, lw * 0.62, cl);
  if (!arm) ell(lf[0] + 1 * s, lf[1] + 2 * s, 3 * s, 2.2 * s, skinD); // rodilla asomando por el roto
  boot(lf[2], lf[3] - 1, 1, "#1a1718", "#0c0b0b");
  // ---- cabeza: cráneo + mandíbula colgante ----
  const tilt = z.spit > 0 ? -0.5 : 0.15 + Math.sin(ph * 0.5) * 0.06;
  const Hx = sx + 8 * s,
    Hy = sy - 8 * s;
  seg(sx, sy + 1 * s, Hx - 2 * s, Hy + 4 * s, 6 * s, 5 * s, skinD); // cuello
  ctx.save();
  ctx.translate(Hx, Hy);
  ctx.rotate(tilt);
  if (z.type === "spitter") {
    ell(-1 * s, 9 * s, 9 * s, 8 * s, fl ? "#fff" : "rgba(140,190,50,.95)");
    circ(2 * s, 10 * s, 3 * s, fl ? "#fff" : "#d6ff6a");
    circ(-4 * s, 12 * s, 2 * s, fl ? "#fff" : "#d6ff6a");
  }
  circ(0, 0, 9 * s, skin);
  ell(-2 * s, -3 * s, 5 * s, 4 * s, skinL); // frente iluminada
  // mandíbula
  const jaw = z.spit > 0 ? 4 : 2 + Math.max(0, Math.sin(ph * 0.7)) * 1.5;
  ctx.fillStyle = skinD;
  ctx.beginPath();
  ctx.moveTo(-2 * s, 4 * s);
  ctx.lineTo(9 * s, 3.5 * s);
  ctx.lineTo(8 * s, (6 + jaw) * s);
  ctx.lineTo(0, (7 + jaw * 0.6) * s);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = fl ? "#fff" : "#1d0606";
  ctx.fillRect(3 * s, 4.2 * s, 6 * s, jaw * s);
  if (!fl) {
    ctx.fillStyle = "#cfc6a8";
    for (let i = 0; i < 3; i++) ctx.fillRect((3.6 + i * 1.9) * s, 4.2 * s, 1 * s, 1.4 * s);
  }
  if (z.hair) {
    ctx.fillStyle = C("#1d1a18");
    ctx.beginPath();
    ctx.arc(-1 * s, -2 * s, 9.4 * s, PI * 0.95, PI * 1.75);
    ctx.lineTo(-3 * s, -4 * s);
    ctx.fill();
  }
  if (arm) {
    ctx.fillStyle = C("#1e2733");
    ctx.beginPath();
    ctx.arc(0, -1 * s, 10.8 * s, PI, TAU);
    ctx.fill();
    ctx.fillRect(-10.8 * s, -1 * s, 21.6 * s, 3 * s);
    ctx.fillStyle = fl ? "#fff" : "rgba(120,160,190,.5)";
    ctx.fillRect(2 * s, -1 * s, 9 * s, 5 * s);
  }
  ell(5 * s, -1.5 * s, 2.8 * s, 2.3 * s, fl ? "#fff" : "#140808"); // cuenca
  circ(5.3 * s, -1.5 * s, 1.7 * s, eye);
  glow(5.3 * s, -1.5 * s, 8 * s, run ? "255,60,40" : "255,200,60", fl || z.dead ? 0 : 0.42);
  ctx.restore();
  // ---- brazo delantero extendido ----
  {
    const ex = sx + 13 * s,
      ey = sy + 8 * s - a1,
      wx = sx + 27 * s * reach,
      wy = sy + 3 * s - a1;
    seg(sx + 1 * s, sy + 2 * s, ex, ey, lw * 0.85, lw * 0.66, skin);
    seg(ex, ey, wx, wy, lw * 0.66, lw * 0.52, skin);
    claw(wx, wy, -0.2, s, skin);
    if (!arm) {
      const m = [lerp(sx, ex, 0.5), lerp(sy, ey, 0.5)];
      seg(sx, sy + 1 * s, m[0], m[1], lw * 1.05, lw * 0.9, cl); // manga rota
    }
  }
  ctx.restore();
}

function mixHex(a, b, t) {
  const x = parseInt(hex6(a).slice(1), 16),
    y = parseInt(hex6(b).slice(1), 16);
  const r = lerp(x >> 16, y >> 16, t) | 0,
    g = lerp((x >> 8) & 255, (y >> 8) & 255, t) | 0,
    bb = lerp(x & 255, y & 255, t) | 0;
  return "#" + ((1 << 24) | (r << 16) | (g << 8) | bb).toString(16).slice(1);
}
/** Expande "#rgb" a "#rrggbb" (el original interpretaba "#777" como azul). */
function hex6(h) {
  return h.length === 4 ? "#" + h[1] + h[1] + h[2] + h[2] + h[3] + h[3] : h;
}
function shade(hex, amt) {
  const n = parseInt(hex6(hex).slice(1), 16);
  let r = n >> 16,
    g = (n >> 8) & 255,
    b = n & 255;
  const f = 1 + amt;
  r = clamp((r * f) | 0, 0, 255);
  g = clamp((g * f) | 0, 0, 255);
  b = clamp((b * f) | 0, 0, 255);
  return "#" + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

/* ---- bosses ---- */
function drawBoss(b) {
  if (!b.air) shadow(b.x, b.w * 0.5, 0.55);
  else shadow(b.x, b.w * 0.4 * (1 - (GROUND - b.y) / 500), 0.4);
  const hw = b.bw * b.sc * 0.9 + 110,
    top = b.h * 1.35 + 60;
  drawActor(b.x - hw, b.y - top, hw * 2, top + 24, () => bossBody(b), {
    outline: 2.2,
    rim: b.flash > 0 ? 0 : undefined,
  });
}
function bossBody(b) {

      ctx.stroke();

      ctx.strokeStyle = C("#777");
      ctx.lineWidth = 4;

      limb3(0, hy, lb[0], lb[1], lb[2], lb[3], 22, C("#2e2620"));

      // body

      ctx.lineTo(sx + 44, hy + 20);

      // shoulders/head (sack mask)

      const Hx = sx + 16,

        ctx.moveTo(-6, 50);
        ctx.lineTo(10, 46);

    case "mother": {
      const s = 1,

      ctx.beginPath();
      ctx.moveTo(x, GROUND - 31);
      ctx.lineTo(x + 7, GROUND - 20);
      ctx.lineTo(x - 7, GROUND - 20);
      ctx.fill();
      ctx.fillStyle = "#111";
      ctx.fillRect(x - 1, GROUND - 28, 2, 5);
      if (o.hp < 30) glow(x, GROUND - 40, 20, "255,120,40", 0.3);
      break;
    }
  }
  ctx.restore();
}
function drawPickup(p) {
  const y = p.y + Math.sin(p.bob) * 5;
  const x = p.x;
  const col = p.kind === "weapon" ? "255,179,64" : p.kind === "med" ? "255,70,70" : "120,230,120";
  glow(x, y, 55, col, 0.35);
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = `rgba(${col},.8)`;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 0, 24 + Math.sin(G.t * 4) * 2, 0, TAU);
  ctx.stroke();
  if (p.kind === "weapon") {
    ctx.fillStyle = "rgba(10,10,10,.6)";
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, TAU);
    ctx.fill();
    ctx.save();
    ctx.rotate(-0.15);
    const sc = p.w === "rocket" || p.w === "sniper" ? 0.62 : 0.85;
    ctx.translate(-20 * sc, 2);
    drawGun(ctx, p.w, sc);
    ctx.restore();
  } else if (p.kind === "med") {
    ctx.fillStyle = "#e8e4dc";
    rrect(-14, -11, 28, 22, 4);
    ctx.fill();
    ctx.fillStyle = "#d42a22";
    ctx.fillRect(-3, -8, 6, 16);
    ctx.fillRect(-8, -3, 16, 6);
  } else {
    ctx.fillStyle = "#3d4a2a";
    rrect(-15, -9, 30, 18, 2);
    ctx.fill();
    ctx.fillStyle = "#c9a24a";
    for (let i = 0; i < 5; i++) ctx.fillRect(-11 + i * 5, -14, 3, 7);
    ctx.fillStyle = "#e8d48a";
    ctx.font = "bold 7px Rajdhani,sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("AMMO", 0, 5);
  }
  ctx.restore();
}
function drawDecor(d) {
  const x = d.x,
    base = GROUND - 12;
  ctx.save();
  // el decorado va al 78% de la velocidad del suelo: es un plano intermedio y debe verse
  // algo más pequeño (antes se dibujaba a escala de primer plano y parecía flotar)
  ctx.translate(x, base);
  ctx.scale(0.84, 0.84);
  ctx.translate(-x, -base);
  switch (d.t) {
    case "lamp":
      ctx.fillStyle = "#0d0c0e";
      ctx.fillRect(x - 3, base - 190, 6, 190);
      ctx.beginPath();
      ctx.moveTo(x, base - 188);
      ctx.quadraticCurveTo(x + 5, base - 206, x + 36, base - 198);
      ctx.lineWidth = 5;
      ctx.strokeStyle = "#0d0c0e";
      ctx.stroke();
      ctx.fillRect(x + 28, base - 200, 20, 7);
      if (d.on) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        const g = ctx.createLinearGradient(0, base - 193, 0, base + 40);
        g.addColorStop(0, "rgba(255,200,130,.22)");
        g.addColorStop(1, "rgba(255,200,130,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(x + 30, base - 193);
        ctx.lineTo(x + 46, base - 193);
        ctx.lineTo(x + 110, base + 30);
        ctx.lineTo(x - 34, base + 30);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        light(x + 38, base - 192, 40, "255,210,150", 0.8);
        light(x + 38, GROUND + 10, 110, "255,190,120", 0.18);
      }
      break;
    case "sign":
      ctx.translate(x, base);
      ctx.rotate(-0.12);
      // dos postes visibles con zapata: el cartel queda anclado al suelo
      ctx.fillStyle = "#2a2528";
      ctx.fillRect(-30, -112, 5, 112);
      ctx.fillRect(25, -112, 5, 112);
      ctx.fillStyle = "#1c181a";
      ctx.fillRect(-34, -6, 13, 8);
      ctx.fillRect(21, -6, 13, 8);
      ctx.fillStyle = "#8a7a2a";
      ctx.fillRect(-40, -130, 80, 40);
      ctx.fillStyle = "#1a1610";
      ctx.fillRect(-37, -127, 74, 34);
      ctx.fillStyle = "#b8a040";
      ctx.font = "bold 11px Rajdhani,sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("⚠ PELIGRO", 0, -112);
      ctx.font = "600 8px Rajdhani,sans-serif";
      ctx.fillText("ZONA EN CUARENTENA", 0, -100);
      ctx.fillStyle = "rgba(0,0,0,.5)";
      ctx.fillRect(-10, -127, 20, 8);
      break;
    case "car":
      ctx.fillStyle = "#0c0b0d";
      ctx.beginPath();
      ctx.moveTo(x - 70, base);
      ctx.lineTo(x - 68, base - 26);
      ctx.lineTo(x - 34, base - 30);
      ctx.lineTo(x - 18, base - 50);
      ctx.lineTo(x + 26, base - 50);
      ctx.lineTo(x + 40, base - 30);
      ctx.lineTo(x + 70, base - 26);
      ctx.lineTo(x + 72, base);
      ctx.fill();
      if (d.seed % 3 === 0) light(x, base - 40, 130, "255,130,50", 0.4);
      break;
    case "bus":
      ctx.fillStyle = "#0b0a0c";
      ctx.save();
      ctx.translate(x, base);
      ctx.rotate(0.05);
      ctx.fillRect(-120, -80, 240, 72);
      ctx.fillStyle = "#141216";
      for (let i = 0; i < 7; i++) ctx.fillRect(-110 + i * 32, -70, 24, 22);
      ctx.restore();
      break;
    case "fire":
      ctx.fillStyle = "#120e0c";
      rrect(x - 14, base - 24, 28, 30, 3);
      ctx.fill();
      light(x, base - 30, 150 + Math.sin(G.t * 20 + d.seed) * 15, "255,130,50", 0.55);
      break;
  }
  ctx.restore();
}
function drawEP(e) {
  if (e.delay > 0) {
    if (e.t === "debris") {
      const a = 0.3 + (1 - e.delay) * 0.5;
      ctx.fillStyle = `rgba(255,40,30,${a * 0.5})`;
      ctx.beginPath();
      ctx.ellipse(e.x, GROUND + 2, 30, 6, 0, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = `rgba(255,80,60,${a})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(e.x, GROUND + 2, 30 * (1 - e.delay * 0.5), 6, 0, 0, TAU);
      ctx.stroke();
    }
    return;
  }
  ctx.save();
  ctx.translate(e.x, e.y);
  switch (e.t) {
    case "acid":
    case "bolt":
      glow(0, 0, 26, "170,255,60", 0.6);
      circ(0, 0, e.r * 0.8, "#7fbf1a");
      circ(-2, -2, e.r * 0.45, "#d8ff7a");
      break;
    case "cleaver":
      ctx.rotate(e.rot);
      ctx.fillStyle = "#8d9298";
      ctx.fillRect(-12, -8, 22, 16);
      ctx.fillStyle = "#2a1e16";
      ctx.fillRect(-20, -2, 8, 4);
      ctx.fillStyle = "rgba(110,10,10,.8)";
      ctx.fillRect(4, -8, 6, 16);
      break;
    case "spike":
      if (e.vx > 0) ctx.scale(-1, 1);
      ctx.fillStyle = "#d8cfc0";
      ctx.beginPath();
      ctx.moveTo(-22, 0);
      ctx.lineTo(18, -5);
      ctx.lineTo(18, 5);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.15)";
      ctx.beginPath();
      ctx.moveTo(20, 0);
      ctx.lineTo(60, 0);
      ctx.stroke();
      break;
    case "boulder":
      ctx.rotate(e.rot);
      ctx.fillStyle = "#3a3534";
      ctx.beginPath();
      for (let i = 0; i < 9; i++) {
        const a = (i / 9) * TAU,
          r = e.r * (0.85 + ((i * 7) % 3) * 0.08);
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.fill();
      ctx.fillStyle = "#4e4746";
      ctx.beginPath();
      ctx.arc(-6, -6, e.r * 0.45, 0, TAU);
      ctx.fill();
      ctx.fillStyle = "#211d1d";
      ctx.fillRect(-4, 4, 14, 5);
      break;
    case "debris":
      ctx.rotate(e.rot);
      ctx.fillStyle = "#4a4342";
      ctx.fillRect(-22, -16, 44, 32);
      ctx.fillStyle = "#2a2524";
      ctx.fillRect(-22, 6, 44, 10);
      ctx.strokeStyle = "#6a5a50";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-10, -16);
      ctx.lineTo(-14, -30);
      ctx.moveTo(8, -16);
      ctx.lineTo(12, -28);
      ctx.stroke();
      break;
    case "shock": {
      ctx.translate(0, GROUND - e.y);
      if (e.vx > 0) ctx.scale(-1, 1);
      const g = ctx.createLinearGradient(0, -e.h, 0, 0);
      g.addColorStop(0, "rgba(255,200,150,0)");
      g.addColorStop(1, "rgba(255,170,110,.5)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-e.w, 0);
      ctx.quadraticCurveTo(-e.w * 0.3, -e.h * 1.2, e.w * 0.3, -e.h * 0.4);
      ctx.lineTo(e.w * 0.5, 0);
      ctx.fill();
      glow(0, -8, 40, "255,150,80", 0.35);
      break;
    }
  }
  ctx.restore();
}
function drawBullet(b) {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  if (b.t === "flame") {
    const t = 1 - b.life / b.max;
    const r = 6 + t * 30;
    const a = Math.min(1, b.life * 3);
    ctx.globalAlpha = a;
    ctx.drawImage(flameSpr(t), b.x - r, b.y - r, r * 2, r * 2);
  } else if (b.t === "rocket") {
    ctx.globalCompositeOperation = "source-over";
    ctx.translate(b.x, b.y);
    ctx.rotate(Math.atan2(b.vy, b.vx));
    ctx.fillStyle = "#4a5038";
    ctx.fillRect(-12, -3, 16, 6);
    ctx.fillStyle = "#2a2a2a";
    ctx.beginPath();
    ctx.moveTo(4, -3);
    ctx.lineTo(12, 0);
    ctx.lineTo(4, 3);
    ctx.fill();
  } else {
    const tl = b.t === "sniper" ? 0.045 : 0.02;
    const x0 = b.x - b.vx * tl,
      y0 = b.y - b.vy * tl;
    const g = ctx.createLinearGradient(x0, y0, b.x, b.y);
    g.addColorStop(0, "rgba(255,200,120,0)");
    g.addColorStop(1, b.t === "sniper" ? "rgba(200,240,255,1)" : "rgba(255,225,160,1)");
    ctx.strokeStyle = g;
    ctx.lineWidth = b.t === "sniper" ? 3.2 : 2;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }
  ctx.restore();
}
function drawParts(add) {
  for (const p of parts) {
    if (!!p.add !== add) continue;
    const t = p.life / p.max;
    if (p.t === "dot" || p.t === "blood") {
      ctx.globalAlpha = Math.min(1, t * 2);
      circ(p.x, p.y, p.s2 >= 0 ? lerp(p.s2, p.s, t) : p.s, p.col);
    } else if (p.t === "smoke") {
      ctx.globalAlpha = t * 0.9;
      circ(p.x, p.y, lerp(p.s2, p.s, t), p.col);
    } else if (p.t === "fire") {
      ctx.globalAlpha = t;
      const r = lerp(p.s2, p.s, t);
      ctx.drawImage(fireSpr(p.col), p.x - r, p.y - r, r * 2, r * 2);
    } else if (p.t === "spark") {
      ctx.globalAlpha = t;
      ctx.strokeStyle = p.col;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * 0.025, p.y - p.vy * 0.025);
      ctx.stroke();
    } else if (p.t === "flash") {
      ctx.globalAlpha = 1;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      const r = p.s * (1 + Math.random() * 0.4);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
      g.addColorStop(0, "rgba(255,255,230,1)");
      g.addColorStop(0.3, "rgba(255,210,120,.9)");
      g.addColorStop(1, "rgba(255,120,30,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-4, 0);
      ctx.lineTo(0, -r * 0.45);
      ctx.lineTo(r * 1.6, 0);
      ctx.lineTo(0, r * 0.45);
      ctx.closePath();
      ctx.fill();
      ctx.fillRect(-r * 0.5, -r * 0.5, r, r);
      ctx.restore();
    } else if (p.t === "rect" || p.t === "shell") {
      ctx.globalAlpha = Math.min(1, t * 3);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      ctx.fillRect(-p.s / 2, -p.s * 0.22, p.s, p.s * 0.45);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}
function drawWarn() {
  const w = G.warn;
  if (!w || G.state !== "play") return;
  const x = P.x,
    y = P.y - (P.slide > 0 ? 70 : 125);
  const a = 0.6 + Math.sin(G.t * 16) * 0.4;
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = a;
  ctx.fillStyle = "rgba(20,0,0,.6)";
  rrect(-52, -15, 104, 30, 8);
  ctx.fill();
  ctx.strokeStyle = "#ff4a3a";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = "#ff6a5a";
  ctx.font = "700 13px Rajdhani,sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(w === "jump" ? "▲ SALTA" : w === "slide" ? "▼ DESLIZA" : "◀ ▶ MUÉVETE", 0, 1);
  ctx.restore();
}

/** Velo de neblina con el color atmosférico de la zona entre y0 e y1. */
function haze(y0, y1, a) {
  const g = ctx.createLinearGradient(0, y0 - 120, 0, y1);
  g.addColorStop(0, `rgba(${ZONE.haze},0)`);
  g.addColorStop(1, `rgba(${ZONE.haze},${a})`);
  ctx.fillStyle = g;
  ctx.fillRect(-10, y0 - 120, VW + 20, y1 - y0 + 122);
}
function render() {
  FX.frame++;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, cv.width, cv.height);
  const sh = G.shake;
  const sx = sh ? rnd(-sh, sh) * 0.6 : 0,
    sy = sh ? rnd(-sh, sh) * 0.6 : 0;
  ctx.setTransform(SC * DPR, 0, 0, SC * DPR, (OX + sx * SC) * DPR, (OY + sy * SC) * DPR);
  ctx.save();
  ctx.beginPath();
  ctx.rect(-10, -10, VW + 20, VH + EXT + 20);
  ctx.clip();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  lights.length = 0;
  const s = G.scroll;
  // cielo de la zona actual (fundido entre zonas)
  const sky = ctx.createLinearGradient(0, 0, 0, VH);
  for (let i = 0; i < 6; i++) sky.addColorStop(SKY_STOPS[i], ZONE.sky[i]);
  ctx.fillStyle = sky;
  ctx.fillRect(-10, -10, VW + 20, VH + 20);
  // resplandor de horizonte
  {
    const hs = glowSpr(ZONE.hor);
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.18;
    ctx.drawImage(hs, VW * 0.3 - 520, 410 - 200, 1040, 400);
    ctx.globalAlpha = 0.13;
    ctx.drawImage(hs, VW * 0.85 - 420, 420 - 170, 840, 340);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }
  // luna desplazada para no quedar tapada por el panel de arma en pantallas estrechas
  const mx = VW * 0.64,
    my = 128;
  glow(mx, my, 260, ZONE.moon, 0.16);
  circ(mx, my, 36, `rgb(${ZONE.moon})`);
  circ(mx - 9, my - 6, 6, "rgba(120,100,90,.35)");
  circ(mx + 10, my + 9, 8, "rgba(120,100,90,.3)");
  circ(mx + 4, my - 14, 4, "rgba(120,100,90,.3)");
  const mg = ctx.createRadialGradient(mx - 10, my - 10, 5, mx, my, 36);
  mg.addColorStop(0, "rgba(0,0,0,0)");
  mg.addColorStop(1, "rgba(40,20,20,.5)");
  ctx.fillStyle = mg;
  ctx.beginPath();
  ctx.arc(mx, my, 34, 0, TAU);
  ctx.fill();
  drawLayer(LY.cl1, s * 0.02 + G.t * 6, 0);
  drawLayer(LY.far, s * 0.06, 0);
  // perspectiva atmosférica: cada plano lejano se funde con el color del aire de la zona
  haze(140, 400, 0.42);
  drawLayer(LY.cl2, s * 0.05 + G.t * 10, 0);
  drawLayer(LY.mid, s * 0.16, 0);
  if (FX.q > 0) haze(250, 440, 0.24);
  drawLayer(LY.near, s * 0.42, 0);
  if (FX.q > 0) haze(330, 452, 0.1);
  for (const d of decor) drawDecor(d);
  if (EXT > 0) {
    ctx.fillStyle = "#0b0a0c";
    ctx.fillRect(-10, VH - 2, VW + 20, EXT + 12);
  }
  drawLayer(LY.ground, s, GROUND - 16);
  for (const d of decals) ell(d.x, d.y, d.r, d.r * 0.22, d.c);
  for (const p of puddles) {
    const a = Math.min(1, p.life);
    ctx.globalAlpha = a;
    ell(p.x, GROUND + 4, p.w / 2, 8, "rgba(110,170,30,.65)");
    ell(p.x - 6, GROUND + 3, p.w / 3, 4, "rgba(200,255,100,.4)");
    ctx.globalAlpha = 1;
    glow(p.x, GROUND, p.w * 0.7, "150,255,50", 0.18 * a);
  }
  for (const o of obs) if (o.t !== "beam") drawObstacle(o);
  for (const p of pick_) drawPickup(p);
  for (const z of zs) if (z.dead) drawZombie(z);
  if (G.boss) drawBoss(G.boss);
  for (const z of zs) if (!z.dead) drawZombie(z);
  if (G.state !== "menu" || true) drawPlayer();
  for (const o of obs) if (o.t === "beam") drawObstacle(o);
  for (const e of ep) drawEP(e);
  drawParts(false);
  for (const b of bul) drawBullet(b);
  ctx.globalCompositeOperation = "lighter";
  drawParts(true);
  ctx.globalCompositeOperation = "source-over";
  // luces dinámicas (sprites cacheados en lugar de un degradado nuevo por luz y frame)
  for (let i = 0; i < lights.length; i += 5)
    blit(lightSpr(lights[i + 3]), lights[i], lights[i + 1], lights[i + 2], lights[i + 4], true);
  // primer plano en parallax rápido: da profundidad sin tapar al jugador
  if (FX.q > 0) drawLayer(LY.fg, s * 1.35, VH + EXT - LY.fg.lh + 6);
  // ash
  for (const a of ash) {
    if (a.ember) {
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = `rgba(255,${(140 + Math.sin(a.ph * 3) * 60) | 0},60,${a.a})`;
    } else ctx.fillStyle = `rgba(180,170,165,${a.a * 0.6})`;
    ctx.fillRect(a.x, a.y, a.s, a.s);
    ctx.globalCompositeOperation = "source-over";
  }
  // ground fog
  const gf = ctx.createLinearGradient(0, GROUND - 40, 0, VH);
  gf.addColorStop(0, `rgba(${ZONE.haze},0)`);
  gf.addColorStop(0.4, `rgba(${ZONE.haze},.12)`);
  gf.addColorStop(1, "rgba(10,8,8,.55)");
  ctx.fillStyle = gf;
  ctx.fillRect(0, GROUND - 40, VW, VH - GROUND + 40);
  if (EXT > 0) {
    ctx.fillStyle = "rgba(10,8,8,.55)";
    ctx.fillRect(-10, VH, VW + 20, EXT + 10);
  }
  // floaters
  ctx.textAlign = "center";
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, f.life * 2);
    ctx.font = `700 ${f.sz}px Teko,Rajdhani,sans-serif`;
    ctx.fillStyle = "rgba(0,0,0,.6)";
    ctx.fillText(f.txt, f.x + 1, f.y + 1);
    ctx.fillStyle = f.col;
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  drawWarn();
  // post
  ctx.drawImage(LY.vig.c, 0, 0, VW, VH + EXT);
  if (G.hurt > 0 || (P.hp < 30 && G.state === "play")) {
    ctx.globalAlpha = Math.max(
      G.hurt * 0.9,
      P.hp < 30 && G.state === "play" ? 0.25 + Math.sin(G.t * 5) * 0.12 : 0,
    );
    ctx.drawImage(LY.dmg.c, 0, 0, VW, VH + EXT);
    ctx.globalAlpha = 1;
  }
  if (G.flashW > 0) {
    ctx.fillStyle = `rgba(255,220,180,${G.flashW * 0.5})`;
    ctx.fillRect(0, 0, VW, VH + EXT);
  }
  ctx.globalAlpha = 0.07;
  ctx.fillStyle = LY.grain;
  ctx.save();
  ctx.translate(rnd(-90, 0), rnd(-90, 0));
  ctx.fillRect(0, 0, VW + 100, VH + EXT + 100);
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.restore();
}
</script>
<script>
"use strict";
/* ================== UI ================== */
const UI = {};
function refreshWeaponUI() {
  const ic = $("wIcon"),
    x = ic.getContext("2d");
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.clearRect(0, 0, ic.width, ic.height);
  const sc = P.cur === "rocket" ? 1.6 : P.cur === "sniper" ? 1.75 : 2.4;
  x.setTransform(1, 0, 0, 1, ic.width / 2 - (WEAP[P.cur].len * sc) / 2 + 8, ic.height / 2 + 4);
  drawGun(x, P.cur, sc);
  $("wName").textContent = WEAP[P.cur].n;
  const sl = $("slots");
  sl.innerHTML = "";
  for (const k of WORDER) {
    const i = document.createElement("i");
    if (P.arms[k] && P.arms[k].own) i.className = "own";
    if (k === P.cur) i.className = "cur";
    sl.appendChild(i);
  }
  UI.w = P.cur;
}
function setTxt(id, v) {
  if (UI[id] !== v) {
    UI[id] = v;
    $(id).textContent = v;
  }
}
function updateHUD() {
  if (G.state === "menu") return;
  document.body.classList.toggle("boss", !!G.boss);
  const hp = Math.max(0, Math.ceil(P.hp));
  setTxt("hpTxt", hp);
  const pc = hp + "%";
  if (UI.hpw !== pc) {
    UI.hpw = pc;
    $("hpFill").style.width = pc;
    $("hpGhost").style.width = pc;
  }
  $("hpBox").classList.toggle("low", hp < 30);
  const d = Math.floor(G.dist);
  if (UI.d !== d) {
    UI.d = d;
    $("dist").innerHTML = d.toLocaleString("es") + "<small>m</small>";
  }
  setTxt("kills", G.kills);
  setTxt("lvl", G.lvl);
  setTxt("score", Math.floor(G.score).toLocaleString("es"));
  const mult = 1 + Math.floor(G.combo / 5);
  const ct = G.combo >= 3 ? `${G.combo} BAJAS · x${mult}` : "";
  setTxt("combo", ct);
  $("combo").classList.toggle("on", G.combo >= 3);
  const a = curA();
  setTxt("mag", P.rl > 0 ? "···" : a.mag);
  setTxt("res", " / " + (a.res === Infinity ? "∞" : a.res));
  $("ammo").classList.toggle("empty", a.mag === 0 && P.rl <= 0);
  $("rlFill").style.width = P.rl > 0 ? 100 * (1 - P.rl / curW().rl) + "%" : "0%";
  if (UI.w !== P.cur) refreshWeaponUI();
  if (G.boss) {
    $("bossFill").style.width = (100 * G.boss.hp) / G.boss.max + "%";
  }
}

function showScreen(id) {
  ["menu", "pause", "over"].forEach((s) => $(s).classList.toggle("hidden", s !== id));
}
function startGame() {
  audioInit();
  HQ.length = 0;
  $("hint").classList.remove("on");
  resetGame();
  showScreen(null);
  $("hud").classList.remove("hidden");
  if (isTouch) $("touch").classList.remove("hidden");
  UI.d = -1;
  UI.hpw = "";
  Object.keys(UI).forEach((k) => delete UI[k]);
  refreshWeaponUI();
  setZone(0, true);
  banner("CORRE", "ZONA 1 · " + ZONES[0].name);
  last = performance.now();
}
function showOver() {
  if (G.state !== "dead") return;
  showScreen("over");
  $("touch").classList.add("hidden");
  $("hud").classList.add("hidden");
  const d = Math.floor(G.dist),
    sc = Math.floor(G.score);
  $("oDist").textContent = d.toLocaleString("es");
  $("oKills").textContent = G.kills;
  $("oBoss").textContent = G.bossesK;
  $("oScore").textContent = sc.toLocaleString("es");
  const rec = sc > (store.best || 0);
  if (rec) {
    store.best = sc;
    store.bestD = d;
    save();
  }
  $("newRec").classList.toggle("hidden", !rec);
  $("oReach").textContent = "NIVEL " + G.lvl + " · " + ZONES[ZONE.i].name;
  $("bestOver").textContent =
    "MEJOR: " +
    (store.best || 0).toLocaleString("es") +
    " PTS · " +
    (store.bestD || 0).toLocaleString("es") +
    " M";
}
function togglePause() {
  if (G.state === "play") {
    G.state = "paused";
    showScreen("pause");
    if (AU.flameG) AU.flameG.gain.setTargetAtTime(0, AU.c.currentTime, 0.03);
    releaseAll();
  } else if (G.state === "paused") {
    G.state = "play";
    showScreen(null);
    last = performance.now();
  }
}
function toMenu() {
  G.state = "menu";
  P = {
    x: 200,
    y: GROUND,
    vy: 0,
    ground: true,
    slide: 0,
    hp: 100,
    inv: 0,
    phase: 0,
    cur: "pistol",
    recoil: 0,
    aim: 0,
    arms: { pistol: { own: 1, mag: 12, res: Infinity } },
    dead: 0,
  };
  zs = [];
  obs = [];
  bul = [];
  ep = [];
  pick_ = [];
  G.boss = null;
  setZone(0, true);
  showScreen("menu");
  $("hud").classList.add("hidden");
  $("touch").classList.add("hidden");
  setBest();
}
function setBest() {
  $("bestMenu").textContent = store.best
    ? "RÉCORD: " +
      store.best.toLocaleString("es") +
      " PTS · " +
      (store.bestD || 0).toLocaleString("es") +
      " M"
    : "";
}
function isFS() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function goFS(user) {
  if (isFS()) return;
  const el = document.documentElement;
  const rq = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!rq) {
    if (user) toast("Este navegador no permite pantalla completa aquí");
    return;
  }
  try {
    const r = rq.call(el, { navigationUI: "hide" });
    const after = () => {
      try {
        screen.orientation && screen.orientation.lock && screen.orientation.lock("landscape").catch(() => {});
      } catch (e) {}
    };
    if (r && r.then)
      r.then(after).catch(() => {
        if (user) toast("No se pudo activar pantalla completa");
      });
    else after();
  } catch (e) {
    if (user) toast("No se pudo activar pantalla completa");
  }
}
function toggleFS() {
  if (isFS()) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else goFS(true);
}
document.addEventListener("fullscreenchange", () => setTimeout(resize, 150));
document.addEventListener("webkitfullscreenchange", () => setTimeout(resize, 150));
$("fsBtn").onclick = (e) => {
  e.stopPropagation();
  toggleFS();
};
$("fsBtn2").onclick = () => toggleFS();
$("playBtn").onclick = () => {
  if (isTouch) goFS(false);
  startGame();
};
$("againBtn").onclick = () => {
  if (isTouch) goFS(false);
  startGame();
};
$("menuBtn").onclick = toMenu;
$("quitBtn").onclick = toMenu;
$("resumeBtn").onclick = togglePause;
$("pauseBtn").onclick = (e) => {
  e.stopPropagation();
  togglePause();
};
$("sndBtn").onclick = () => {
  audioInit();
  setSound(!AU.on);
};
$("sndBtn2").onclick = () => setSound(!AU.on);
/** Panel de controles (menú y pausa), adaptado a teclado o a pantalla táctil. */
function setKeysInfo() {
  const kb = (...k) => k.map((x) => `<kbd>${x}</kbd>`).join("");
  const rows = isTouch
    ? [
        ["◀ ▶", "moverse"],
        ["▲", "saltar · 2 toques: doble salto"],
        ["▼", "deslizarse / caída rápida"],
        ["FUEGO", "mantén para disparar"],
        ["ARMA", "cambiar de arma"],
        ["❚❚", "pausa"],
      ]
    : [
        [kb("A", "D"), "moverse"],
        [kb("W", "Espacio"), "saltar · doble salto"],
        [kb("S"), "deslizarse / caída rápida"],
        [kb("J") + " / clic", "disparar (mantén)"],
        [kb("Q") + " " + kb("1-7"), "cambiar / elegir arma"],
        [kb("R"), "recargar"],
        [kb("P") + " " + kb("Esc"), "pausa"],
        [kb("Enter"), "jugar / continuar"],
      ];
  const html = rows.map(([k, t]) => `<div class="k"><span>${k}</span><span>${t}</span></div>`).join("");
  $("keysInfo").innerHTML = html;
  $("keysPause").innerHTML = html;
}
setKeysInfo();
document.addEventListener("visibilitychange", () => {
  if (document.hidden && G.state === "play") togglePause();
});
// redimensionado con espera: en móvil la barra del navegador dispara decenas de eventos
// y cada uno reconstruía todas las capas del escenario
let rsT = 0;
addEventListener("resize", () => {
  clearTimeout(rsT);
  rsT = setTimeout(resize, 120);
});
</script>
<script>
"use strict";
/* ================== LOOP ================== */
let last = performance.now();
function frame(now) {
  const raw = (now - last) / 1000;
  let dt = Math.min(0.034, raw);
  qualityTick(Math.min(raw, 0.1));
  last = now;
  if (G.slowT > 0) {
    G.slowT -= dt;
    if (G.slowT <= 0) G.slow = 1;
  }
  if (G.state !== "paused") zoneTick(dt);
  if (G.state !== "paused") {
    // menu attract: player runs
    if (G.state === "menu") {
      P.phase += dt * 10;
      P.y = GROUND;
      P.ground = true;
      P.hipY = -46;
    }
    update(dt * G.slow);
  }
  render();
  updateHUD();
  requestAnimationFrame(frame);
}
resize();
setSound(AU.on);
setBest();
requestAnimationFrame(frame);
</script>
</body>
</html>
